openapi: 3.1.0
info:
  title: S1 负责人查询增量接口合同
  version: 1.0.0
  description: 本文件规定本批新增查询参数与响应字段；既有业务字段和动作权限继续按原领域 DTO 执行。S1 不提供组织隔离或销售责任改派。
servers:
  - url: http://localhost:10001
security:
  - bearerAuth: []
paths:
  /admin/customers:
    get:
      operationId: customers_owner_query
      summary: 查询客户当前主负责人范围内的数据
      description: |
        使用 DataScope v2 当前客户范围；人员与组织条件只收窄结果。
        需要 customer:list。scope=all_authorized 必须改用 /admin/customers/all-authorized，本接口拒绝。
        列表、总数、导出复用相同条件；跨页与 CSV 必须携带同一 scope_version。
      parameters:
        - $ref: '#/components/parameters/ScopeVersion'
        - $ref: '#/components/parameters/OwnerIds'
        - $ref: '#/components/parameters/OrgUnitIds'
        - $ref: '#/components/parameters/IncludeDescendants'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 原 ApiResponse 信封内的分页 data，增加授权时点、范围版本、归属口径摘要；人员候选独立查询人员目录。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomerPage'
        '400':
          description: Query 解码拒绝未知参数、旧姓名参数、空 ID、非法格式、超过 100 个 ID，或常规列表提交 all_authorized。
        '401':
          description: 未登录或会话失效。
        '403':
          description: 缺少 customer:list；人员或组织条件不能授予权限。
        '409':
          $ref: '#/components/responses/DataScopeChanged'
  /admin/customers/all-authorized:
    get:
      operationId: customers_all_authorized_owner_query
      summary: 查询全部有权客户当前主负责人范围内的数据
      description: |
        需要 customer_scope:detail 与 customer:list。在 DataScope v2 已授权结果上列出全部有权客户，
        不得解释为公司范围。人员与组织条件只收窄结果；跨页与 CSV 必须携带同一 scope_version。
      parameters:
        - $ref: '#/components/parameters/ScopeVersion'
        - $ref: '#/components/parameters/OwnerIds'
        - $ref: '#/components/parameters/OrgUnitIds'
        - $ref: '#/components/parameters/IncludeDescendants'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 原 ApiResponse 信封内的分页 data，增加授权时点、范围版本、归属口径摘要；人员候选独立查询人员目录。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomerPage'
        '400':
          description: Query 解码拒绝未知参数、旧姓名参数、空 ID、非法格式或超过 100 个 ID。
        '401':
          description: 未登录或会话失效。
        '403':
          description: 缺少 customer:list 或 customer_scope:detail；人员或组织条件不能授予权限。
        '409':
          $ref: '#/components/responses/DataScopeChanged'
  /admin/contracts:
    get:
      operationId: contracts_owner_query
      summary: 查询合同当前跟进负责人范围内的数据
      description: 仅在既有授权结果上按人员 ID 收窄；同字段 OR，不同字段 AND。owner、组织和处理人等未注册参数必须拒绝。列表、总数、导出复用相同条件。
      parameters:
        - $ref: '#/components/parameters/OwnerIds'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 原 ApiResponse 信封内的分页 data，增加完整可见范围候选与负责人口径。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OwnerPage'
        '400':
          description: Query 解码拒绝未知参数、旧姓名参数、空 ID、非法格式或超过 100 个 ID。
        '401':
          description: 未登录或会话失效。
        '403':
          description: 缺少原资源读取权限；人员条件不能授予权限。
  /admin/sales-orders:
    get:
      operationId: sales_orders_owner_query
      summary: 查询销售单负责销售范围内的数据
      description: 使用 DataScope v2 当前销售责任范围；人员条件只收窄结果。范围版本、独立详情和导出复核按 organization-data-scope-s3-openapi.yaml 执行。
      parameters:
        - $ref: './organization-data-scope-s3-openapi.yaml#/components/parameters/ScopeVersion'
        - $ref: '#/components/parameters/OwnerIds'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 原 ApiResponse 信封内的分页 data，增加完整可见范围候选与负责人口径。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OwnerPage'
        '400':
          description: Query 解码拒绝未知参数、旧姓名参数、空 ID、非法格式或超过 100 个 ID。
        '401':
          description: 未登录或会话失效。
        '403':
          description: 缺少原资源读取权限；人员条件不能授予权限。
  /admin/purchase-orders:
    get:
      operationId: purchase_orders_owner_query
      summary: 查询采购单当前采购负责人范围内的数据
      description: 仅在既有授权结果上按人员 ID 收窄；同字段 OR，不同字段 AND。owner、组织和处理人等未注册参数必须拒绝。列表、总数、导出复用相同条件。
      parameters:
        - $ref: '#/components/parameters/OwnerIds'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 原 ApiResponse 信封内的分页 data，增加完整可见范围候选与负责人口径。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OwnerPage'
        '400':
          description: Query 解码拒绝未知参数、旧姓名参数、空 ID、非法格式或超过 100 个 ID。
        '401':
          description: 未登录或会话失效。
        '403':
          description: 缺少原资源读取权限；人员条件不能授予权限。
  /admin/contracts/{id}:
    get:
      operationId: contract_current_owner_detail
      summary: 合同详情增加当前跟进负责人
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 原合同详情 data 增加 owner_user_id、owner_user_name，可为空；权威来源是关联客户当前主负责人。
        '403':
          description: 无读取权限。
        '404':
          description: 合同不存在或不可见。
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ScopeVersion:
      name: scope_version
      in: query
      required: false
      description: 第二页起必填；第一页重验或下载前校验时也可提供。必须来自本资源同一筛选的服务端响应。
      schema: {type: string, minLength: 1, maxLength: 256}
    OwnerIds:
      name: owner_user_ids
      in: query
      required: false
      description: 逗号分隔的人员稳定 ID；去空白、去重，最多 100 项；省略表示不追加条件，显式空值拒绝。不得提交姓名。
      schema:
        type: string
        minLength: 1
        pattern: '^\s*[A-Za-z0-9_-]{1,128}\s*(,\s*[A-Za-z0-9_-]{1,128}\s*){0,99}$'
      example: 'user-1,user-2'
    OrgUnitIds:
      name: org_unit_ids
      in: query
      required: false
      description: 逗号分隔的当前主负责人所属组织 ID；去空白、去重，最多 100 项；只收窄授权结果。包含下级时必须提供。
      schema:
        type: string
        minLength: 1
        pattern: '^\s*[A-Za-z0-9_-]{1,128}\s*(,\s*[A-Za-z0-9_-]{1,128}\s*){0,99}$'
      example: 'org-1,org-2'
    IncludeDescendants:
      name: include_descendants
      in: query
      required: false
      description: 组织筛选是否包含有效下级；缺省 false。为 true 时必须同时提供 org_unit_ids。
      schema: {type: boolean, default: false}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  responses:
    DataScopeChanged:
      description: DATA_SCOPE_CHANGED；HTTP 稳定码为 DATA_SCOPE_CHANGED。清除旧结果并从第一页刷新，不拼接旧页面或输出旧文件。
  schemas:
    CustomerPage:
      allOf:
        - $ref: '#/components/schemas/OwnerPage'
        - type: object
          required: [scope_version, policy_version, organization_version, as_of, scope_summary]
          properties:
            scope_version: {type: string}
            policy_version: {type: integer, minimum: 0}
            organization_version: {type: integer, minimum: 0}
            as_of: {type: string, format: date-time, description: 授权解析时点；客户端不得用本地时钟代替。}
            scope_summary: {type: string}
            empty_reason: {type: [string, 'null'], enum: [no_scope, null], description: 仅角色无有效范围时为 no_scope；有规则但对象为空不使用该值。}
            ownership_basis:
              type: string
              enum: [current_customer_owner]
    OwnerPage:
      type: object
      required: [items, total, page, page_size, ownership_basis]
      properties:
        items:
          type: array
          description: 原业务列表行；负责人 ID 是稳定身份，姓名只用于显示。
          items: {type: object}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        ownership_basis:
          type: string
          enum: [current_customer_owner, document_sales_owner, current_procurement_owner]
