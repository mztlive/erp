openapi: 3.1.0
info:
  title: S1 负责人查询增量接口合同
  version: 1.0.0
  description: 本文件规定本批新增查询参数与响应字段；既有业务字段和动作权限继续按原领域 DTO 执行。S1 不提供组织隔离或销售责任改派。
servers:
  - url: http://localhost:10001
security:
  - bearerAuth: []
paths:
  /admin/customers:
    get:
      operationId: customers_owner_query
      summary: 查询客户当前主负责人范围内的数据
      description: 仅在既有授权结果上按人员 ID 收窄；同字段 OR，不同字段 AND。owner、组织和处理人等未注册参数必须拒绝。列表、总数、导出复用相同条件。
      parameters:
        - $ref: '#/components/parameters/OwnerIds'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 原 ApiResponse 信封内的分页 data，增加完整可见范围候选与负责人口径。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OwnerPage'
        '400':
          description: Query 解码拒绝未知参数、旧姓名参数、空 ID、非法格式或超过 100 个 ID。
        '401':
          description: 未登录或会话失效。
        '403':
          description: 缺少原资源读取权限；人员条件不能授予权限。
  /admin/customers/all-authorized:
    get:
      operationId: customers_all_authorized_owner_query
      summary: 查询全部有权客户当前主负责人范围内的数据
      description: 仅在既有授权结果上按人员 ID 收窄；同字段 OR，不同字段 AND。owner、组织和处理人等未注册参数必须拒绝。列表、总数、导出复用相同条件。
      parameters:
        - $ref: '#/components/parameters/OwnerIds'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 原 ApiResponse 信封内的分页 data，增加完整可见范围候选与负责人口径。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OwnerPage'
        '400':
          description: Query 解码拒绝未知参数、旧姓名参数、空 ID、非法格式或超过 100 个 ID。
        '401':
          description: 未登录或会话失效。
        '403':
          description: 缺少原资源读取权限；人员条件不能授予权限。
  /admin/contracts:
    get:
      operationId: contracts_owner_query
      summary: 查询合同当前跟进负责人范围内的数据
