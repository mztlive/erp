  /admin/sales-orders:
    get:
      operationId: sales_orders_owner_query
      summary: 查询销售单负责销售范围内的数据
      description: 仅在既有授权结果上按人员 ID 收窄；同字段 OR，不同字段 AND。owner、组织和处理人等未注册参数必须拒绝。列表、总数、导出复用相同条件。
      parameters:
