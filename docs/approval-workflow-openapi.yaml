openapi: 3.0.3
info:
  title: ERP 审批流程线协议
  version: 1.0.0
  license:
    name: Proprietary
    url: https://www.rfc-editor.org/rfc/rfc2616
  description: |
    本文件是审批线协议的唯一权威 OpenAPI。业务语义以
    [approval-workflow-contract.md](./approval-workflow-contract.md) 为准；
    稳定错误码以 [approval-workflow-error-catalog.md](./approval-workflow-error-catalog.md) 为准。

    `bpm` 是无 ERP、无 I/O 的下层流程引擎。`services::approval` 是 ERP 适配和事务编排层。
    HTTP Handler 只做协议适配、认证上下文注入和信封转换，不得构造 `TransitionPlan`、
    调用 BPM 引擎、解释 `ProcessKind` 或把 BPM/数据库错误直接暴露给客户端。

    全部管理员路由位于 `/admin`，必须携带 JWT，并同时通过 Handler 动作级权限与
    Service 资源级政策双门禁。具备动作级权限不得自动获得任一 `DocumentType` 的管理权。

    ## 权限双门禁按动作映射

    | 端点族 | Handler 动作级权限 | Service 第二门禁 |
    | --- | --- | --- |
    | 固定目录读取 | `approval_process:read` | 返回合同 §4.3 共 20 行非敏感目录；不得包含节点或审批人详情 |
    | 定义版本与详情 | `approval_process:read` | 该 `PROCESS_REQUIRED` 类型的定义管理权或运行管理权 |
    | 定义期候选人 | `approval_process:read` | 该类型定义管理权；只做定义期静态过滤 |
    | 创建草稿 | `approval_process:create` | 该类型定义管理权 |
    | 替换节点 | `approval_process:edit` | 该类型定义管理权 |
    | 发布 | `approval_process:publish` | 该类型定义管理权 |
    | 退役 | `approval_process:retire` | 该类型定义管理权 |
    | 未提交绑定升级 | `approval_instance:upgrade_binding` | 该类型定义管理权 + 单据对象读取权 + DataScope |
    | 实例列表/详情/历史 | `approval_instance:read` | 本人发起、本人当前责任或对象读取权与 DataScope；`managed`/`blocked` 另需类型运行管理权 |
    | 恢复选项 | `approval_instance:read` | 该类型运行管理权 + 实例对象读取权 + DataScope；无权不得泄露存在性 |
    | 决定 | `approval_instance:decide` | 当前开放任务责任 + 当前审批人资格 + 对象读取权 + DataScope + 岗位分离 |
    | 恢复当前审批人 | `approval_instance:resume` | 该类型运行管理权 + 实例对象读取权 + DataScope |
    | 受阻取消 | `approval_instance:cancel_blocked` | 该类型运行管理权 + 实例对象读取权 + DataScope；只接受非人员一致性 blocker |
    | 通用待办转交/关闭 | `work_item:reassign` / `work_item:close` | 非审批任务责任校验；`DocumentApproval` 或带 `approval_node_execution_id` 的任务必须 409 |

    普通撤回继续走各业务资源路由，内部调用统一审批端口，并校验 `approval_instance:cancel`。
    不得新增通用 `/start` 或 `/cancel` 路由。不得保留 `POST /approval-instances/{id}/recover`、
    `RETRY_CURRENT_STEP`、`/work-items/{id}/claim`、`/start-processing` 或 `/release-to-team`。

    ## 协议不变量

    - 写请求体必须 `additionalProperties: false`；未知字段、连线、入口、角色、候选池、脚本、
      处理器、业务动作、下一节点、驳回目标、下一审批人、源定义 ID 和 actor 一律拒绝。
    - 全部乐观锁版本均为十进制正整数字符串，禁止向浏览器暴露 JS 不安全整数。
    - 变更请求必须携带幂等键。同键同 canonical payload 且仍有权时返回 2xx 最新摘要，不得描述为原请求时刻快照。
    - 列表只接受固定 `view`、可选 `document_type`/`status`/`q`、编码当前 view 两个排序字段的 `cursor` 和页上限。
    - 403/404 不得附带可推断资源存在性或内部版本的 `data`。409 必须带稳定码、`correlation_id` 和调用者有权查看的最新版本。
    - `APPROVAL_POLICY_NOT_REGISTERED` 只允许映射为 500 并触发 readiness 失败，不得映射为 4xx。
servers:
  - url: http://127.0.0.1:10001
    description: 本地开发 Web API
tags:
  - name: ApprovalProcess
    description: 固定单据类型审批流程定义管理。
  - name: ApprovalInstance
    description: 审批运行、决定、查询、恢复与受阻取消。
  - name: WorkItem
    description: 通用待办读取与非审批任务保护写接口。
security:
  - bearerAuth: []
paths:
  /admin/approval-processes/catalog:
    get:
      tags: [ApprovalProcess]
      operationId: listApprovalProcessCatalog
      summary: 读取固定 20 行非敏感审批目录
      description: |
        动作级权限 `approval_process:read`。返回合同 §4.3 全部 20 个 `DocumentType` 的政策、
        当前版本和配置状态。不得包含节点图或审批人详情。
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: 目录行。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionCatalogSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-processes/{document_type}/versions:
    get:
      tags: [ApprovalProcess]
      operationId: listApprovalProcessVersions
      summary: 列出某单据类型的定义版本
      description: |
        动作级权限 `approval_process:read`。读取 `PROCESS_REQUIRED` 类型的版本列表时，
        还必须具备该类型定义管理权或运行管理权。`NO_APPROVAL` 无定义详情。无权或不适用时不得泄露存在性。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/DocumentTypePath'
      responses:
        '200':
          description: 版本摘要列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionVersionListSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-processes/{document_type}/eligible-assignees:
    get:
      tags: [ApprovalProcess]
      operationId: listDefinitionEligibleAssignees
      summary: 按定义期静态规则搜索可选审批人
      description: |
        动作级权限 `approval_process:read`，并再校验该类型定义管理权。
        只执行定义期静态过滤；该候选列表不得用于运行期改变审批责任人。
        `limit` 默认 20、最大 50。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/DocumentTypePath'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 定义期候选人。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssigneeCandidateListSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-process-definitions/drafts:
    post:
      tags: [ApprovalProcess]
      operationId: createApprovalProcessDraft
      summary: 创建更高版本审批流程草稿
      description: |
        动作级权限 `approval_process:create`，并再校验该类型定义管理权。
        请求只允许 `document_type`、`name`、`draft_source=EMPTY|CURRENT_PUBLISHED` 和幂等键。
        不得提交源定义 ID。选择 `CURRENT_PUBLISHED` 但当前无发布定义时返回
        `APPROVAL_DRAFT_SOURCE_NOT_AVAILABLE`。
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDefinitionDraftRequest'
      responses:
        '200':
          description: 新建草稿详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionDetailSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-process-definitions/{id}:
    get:
      tags: [ApprovalProcess]
      operationId: getApprovalProcessDefinition
      summary: 读取定义图详情
      description: |
        动作级权限 `approval_process:read`。读取 `PROCESS_REQUIRED` 类型详情时还必须具备
        该类型定义管理权或运行管理权。无权或不存在时不得泄露存在性。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/DefinitionIdPath'
      responses:
        '200':
          description: 定义详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionDetailSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-process-definitions/{id}/nodes:
    put:
      tags: [ApprovalProcess]
      operationId: replaceApprovalProcessNodes
      summary: 整组替换草稿节点
      description: |
        动作级权限 `approval_process:edit`，并再校验该类型定义管理权。
        路径提供 `id`，请求体不得携带 definition ID。新增节点不接受 `node_key`；
        编辑已有节点只接受本定义内 `node_id`。不得接受连线、入口、角色、候选池、脚本、
        处理器、业务动作、状态或 `node_purpose`。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/DefinitionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceNodesRequest'
      responses:
        '200':
          description: 替换后的草稿详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionDetailSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-process-definitions/{id}/publish:
    post:
      tags: [ApprovalProcess]
      operationId: publishApprovalProcessDefinition
      summary: 发布草稿并退役旧版本
      description: |
        动作级权限 `approval_process:publish`，并再校验该类型定义管理权。
        请求只允许定义锁版本字符串和幂等键。发布只校验账户有效、静态审批权限、
        可静态判断的岗位分离和图不变式，不得声称完成实例级 DataScope 校验。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/DefinitionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinitionLockRequest'
      responses:
        '200':
          description: 已发布定义详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionDetailSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-process-definitions/{id}/retire:
    post:
      tags: [ApprovalProcess]
      operationId: retireApprovalProcessDefinition
      summary: 退役当前已发布定义
      description: |
        动作级权限 `approval_process:retire`，并再校验该类型定义管理权。
        退役只阻止新单据绑定，不得改写已运行实例。请求只允许定义锁版本字符串和幂等键。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/DefinitionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinitionLockRequest'
      responses:
        '200':
          description: 已退役定义详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionDetailSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-decisions:
    post:
      tags: [ApprovalInstance]
      operationId: submitApprovalDecision
      summary: 对当前开放审批任务通过或驳回
      description: |
        动作级权限 `approval_instance:decide`。Service 仍须校验任务本人责任、对象读取权、
        DataScope 和岗位分离。actor 只从认证上下文注入。
        请求体只允许 `work_item_id`、`decision`、可空 `reason`、字符串 `expected_task_version` 和幂等键。
        必须拒绝 instance、execution、definition、subject、next node、reject target、
        next assignee、业务 action 和 actor 字段。
        人员失效时必须先提交 BLOCKED 事实，再映射为 409 `APPROVAL_INSTANCE_BLOCKED`，不得回滚阻塞状态。
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitDecisionRequest'
      responses:
        '200':
          description: 最新实例摘要；幂等回读同样使用 2xx。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCommandSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-instances:
    get:
      tags: [ApprovalInstance]
      operationId: listApprovalInstances
      summary: 按固定 view 查询实例摘要
      description: |
        动作级权限 `approval_instance:read`。只允许：
        `view=mine|started|managed|blocked`、可选 `document_type`、可选 `status`、
        可选 `q`（单据编号、对象 ID、当前节点或当前审批人的字面量包含匹配，最长 128）、
        `cursor` 和 `limit`（默认 20，最大 100）。
        `mine` 只接受省略 `status` 或 `status=RUNNING`；`blocked` 只接受省略 `status` 或 `status=BLOCKED`。
        其他组合必须 422，不得返回伪空列表。不得接受任意排序、任意 owner ID 或 `all=true`。
        `q` 按字面量检索，不得当作正则执行。
        cursor 必须编码当前 view 名称及该 view 的两个排序字段，跨 view 使用必须拒绝。
        排序固定为：
        `mine`=`assigned_at desc, work_item_id desc`；
        `started`=`started_at desc, instance_id desc`；
        `managed`=`updated_at desc, instance_id desc`；
        `blocked`=`blocked_at desc, instance_id desc`。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - name: view
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/InstanceListView'
        - name: document_type
          in: query
          schema:
            $ref: '#/components/schemas/DocumentType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InstanceStatus'
        - name: q
          in: query
          description: 按单据编号、对象 ID、当前节点名或当前审批人做字面量包含匹配。
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 游标分页实例摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceListSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-instances/{id}:
    get:
      tags: [ApprovalInstance]
      operationId: getApprovalInstance
      summary: 读取实例、当前责任和最近执行摘要
      description: |
        动作级权限 `approval_instance:read`。查看审批实例不隐含查看全部业务字段。
        详情最多返回最近 20 条执行摘要并携带 `history_next_cursor`。无权时不得泄露存在性。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/InstanceIdPath'
      responses:
        '200':
          description: 实例详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceDetailSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-instances/{id}/history:
    get:
      tags: [ApprovalInstance]
      operationId: listApprovalInstanceHistory
      summary: 按轮次和执行序号读取完整历史
      description: |
        动作级权限 `approval_instance:read`。默认 50、最大 100。
        排序固定 `round_no asc, execution_no asc, id asc`。只返回新运行模型，不得读取旧实例或旧步骤。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/InstanceIdPath'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 历史执行页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceHistorySuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-instances/{id}/recovery-options:
    get:
      tags: [ApprovalInstance]
      operationId: getApprovalRecoveryOptions
      summary: 返回当前 blocker 的唯一合法恢复方式
      description: |
        动作级权限 `approval_instance:read`，并再校验该类型运行管理权、对象读取权和 DataScope。
        人员失效只允许原审批人重新合格后恢复；非人员一致性 blocker 只允许受阻取消。
        审批运行时不提供转交或改派。无权时不得泄露实例存在性。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/InstanceIdPath'
      responses:
        '200':
          description: 唯一合法恢复动作。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryOptionsSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-instances/{id}/resume-current-approver:
    post:
      tags: [ApprovalInstance]
      operationId: resumeCurrentApprover
      summary: 原审批人重新合格后恢复当前节点
      description: |
        动作级权限 `approval_instance:resume`，并再校验该类型运行管理权和实例 DataScope。
        请求只允许实例/执行/分派版本、可空已关闭任务版本和幂等键。
        不得接受目标用户、决定、节点或恢复动作枚举。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/InstanceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeApproverRequest'
      responses:
        '200':
          description: 恢复后的最新实例摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCommandSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/approval-instances/{id}/cancel-blocked:
    post:
      tags: [ApprovalInstance]
      operationId: cancelBlockedApproval
      summary: 取消非人员一致性 blocker
      description: |
        动作级权限 `approval_instance:cancel_blocked`，并再校验该类型运行管理权和实例 DataScope。
        请求只允许非空原因、实例/执行版本、可空任务版本和幂等键。
        必须执行政策绑定的同一 `cancel_action`。不得接受新定义、修复值、下一节点或目标用户。
        人员失效 blocker 必须拒绝。政策缺少必需动作属于 `APPROVAL_POLICY_NOT_REGISTERED`/500。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/InstanceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBlockedRequest'
      responses:
        '200':
          description: 受阻取消后的最新实例摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCommandSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/business-documents/{document_type}/{id}/approval-definition/upgrade:
    post:
      tags: [ApprovalInstance]
      operationId: upgradeUnsubmittedApprovalBinding
      summary: 升级未提交单据绑定到当前发布版本
      description: |
        动作级权限 `approval_instance:upgrade_binding`，并再校验该类型定义管理权、
        单据对象读取权和 DataScope。请求只允许原因、单据版本、绑定版本和幂等键。
        目标定义固定取当前发布版本，不得由客户端提交 definition ID。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/DocumentTypePath'
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeBindingRequest'
      responses:
        '200':
          description: 升级后的绑定与单据摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCommandSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/PolicyNotRegistered'

  /admin/work-items:
    get:
      tags: [WorkItem]
      operationId: listWorkItems
      summary: 查询授权范围内的待办投影
      description: |
        动作级权限 `work_item:list`。响应必须输出 `responsibility_kind`、
        `work_item_type`、目标路由摘要和 `allowed_actions`。
        `PERSONAL_APPROVAL` 必须对应 `DocumentApproval`。任何 `OPEN` 任务的 `owner_user_id` 必填。
        前端不得根据历史责任模式或卡券类型推断路由。
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: 带责任类型的待办页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemPageSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/work-items/stats:
    get:
      tags: [WorkItem]
      operationId: getWorkItemStats
      summary: 查询与列表同一授权快照的待办统计
      description: 动作级权限 `work_item:list`。不得由前端对已加载条目求和。
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: 统计快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemStatsSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/work-items/{id}:
    get:
      tags: [WorkItem]
      operationId: getWorkItem
      summary: 查询单条待办安全投影
      description: 动作级权限 `work_item:detail`。无权时不得泄露存在性。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/WorkItemIdPath'
      responses:
        '200':
          description: 带责任类型的任务投影。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/work-items/{id}/reassign:
    post:
      tags: [WorkItem]
      operationId: reassignNonApprovalWorkItem
      summary: 转交开放非审批任务
      description: |
        动作级权限 `work_item:reassign`。仅供非审批任务使用。
        `WorkItemType::DocumentApproval` 或带 `approval_node_execution_id` 的任务必须返回
        `APPROVAL_GENERIC_WORK_ITEM_MUTATION_FORBIDDEN`。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/WorkItemIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignWorkItemRequest'
      responses:
        '200':
          description: 责任已更新的同一任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/work-items/{id}/close:
    post:
      tags: [WorkItem]
      operationId: closeNonApprovalWorkItem
      summary: 关闭允许人工关闭的非审批任务
      description: |
        动作级权限 `work_item:close`。仅供非审批任务使用。审批任务必须失败关闭。
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/WorkItemIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseWorkItemRequest'
      responses:
        '200':
          description: 已关闭任务的只读事实。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemSuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理员 JWT。未认证返回 401 `UNAUTHENTICATED`。
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
      description: 可选关联 ID。缺省时服务端生成。409 必须回传同一关联 ID。
    DocumentTypePath:
      name: document_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DocumentType'
    DefinitionIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    InstanceIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    WorkItemIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Search:
      name: search
      in: query
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
      description: 必须编码当前 view 名称及该 view 的两个排序字段。跨 view 使用必须 422。
  responses:
    Unauthenticated:
      description: 未认证。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: 401
            errorMessage: 登录状态已失效，请重新登录
            code: UNAUTHENTICATED
            data: null
            success: false
    Forbidden:
      description: 无权。不得附带资源存在性或内部版本。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: 403
            errorMessage: 当前账号没有执行此操作的权限
            code: PERMISSION_DENIED
            data: null
            success: false
    NotFound:
      description: 资源不存在或无权得知其存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: 404
            errorMessage: 资源不存在
            code: NOT_FOUND
            data: null
            success: false
    BadRequest:
      description: 协议字段非法，例如版本不是正整数字符串。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: 400
            errorMessage: 审批任务期望版本必须是正整数字符串
            code: INVALID_REQUEST
            data: null
            success: false
    Unprocessable:
      description: 校验失败。未知字段、非法 view/status、超页上限或业务规则不满足。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 稳定冲突。必须包含 code 与 data.correlation_id。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictEnvelope'
    PolicyNotRegistered:
      description: |
        部署不变量失败。`APPROVAL_POLICY_NOT_REGISTERED` 必须为 500 并触发 readiness 失败，
        不得映射为 4xx。对外消息只允许「系统内部错误」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: 500
            errorMessage: 系统内部错误
            code: APPROVAL_POLICY_NOT_REGISTERED
            data: null
            success: false
    InternalError:
      description: 未分类内部错误。不得泄露底层细节。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: 500
            errorMessage: 系统内部错误
            code: INTERNAL_ERROR
            data: null
            success: false
  schemas:
    VersionString:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: 十进制正整数字符串。禁止 JS 不安全整数。
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
    DocumentType:
      type: string
      enum:
        - sales_order
        - voucher_sales_order
        - sales_change_order
        - purchase_order
        - purchase_change_order
        - purchase_receipt
        - delivery
        - electronic_delivery
        - service_fulfillment
        - customer_acceptance
        - stock_adjustment
        - customer_receipt
        - supplier_payment
        - invoice
        - sales_return_case
        - purchase_return_order
        - customer_refund
        - supplier_refund
        - receipt_reversal
        - payment_reversal
    InstanceListView:
      type: string
      enum: [mine, started, managed, blocked]
    InstanceStatus:
      type: string
      enum: [RUNNING, APPROVED, CANCELLED, BLOCKED]
    DecisionValue:
      type: string
      enum: [APPROVE, REJECT]
    DraftSource:
      type: string
      enum: [EMPTY, CURRENT_PUBLISHED]
    ApprovalRequirement:
      type: string
      enum: [NO_APPROVAL, PROCESS_REQUIRED]
    DefinitionConfigurationStatus:
      type: string
      enum: [NOT_APPLICABLE, MISSING_CONFIGURATION, DRAFT, PUBLISHED]
    DefinitionAllowedAction:
      type: string
      enum: [CREATE_DRAFT, REPLACE_NODES, PUBLISH, RETIRE]
    RecoveryAction:
      type: string
      enum: [RESUME_CURRENT_APPROVER, CANCEL_BLOCKED]
    CommandOutcome:
      type: string
      enum: [APPLIED, BLOCKED, IDEMPOTENT_REPLAY]
    ResponsibilityKind:
      type: string
      enum: [PERSONAL_APPROVAL, PERSONAL_BUSINESS_TASK]
    CreateDefinitionDraftRequest:
      type: object
      additionalProperties: false
      required: [document_type, name, draft_source, idempotency_key]
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentType'
        name:
          type: string
          minLength: 1
        draft_source:
          $ref: '#/components/schemas/DraftSource'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    DefinitionNodeRequest:
      type: object
      additionalProperties: false
      required: [node_name, display_order, assignee_user_id]
      properties:
        node_id:
          type: string
          minLength: 1
          description: 仅编辑本定义已有节点时允许。新增节点必须省略。
        node_name:
          type: string
          minLength: 1
        display_order:
          type: integer
          minimum: 1
        assignee_user_id:
          type: string
          minLength: 1
    ReplaceNodesRequest:
      type: object
      additionalProperties: false
      required: [expected_definition_lock_version, nodes]
      properties:
        expected_definition_lock_version:
          $ref: '#/components/schemas/VersionString'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionNodeRequest'
    DefinitionLockRequest:
      type: object
      additionalProperties: false
      required: [expected_definition_lock_version, idempotency_key]
      properties:
        expected_definition_lock_version:
          $ref: '#/components/schemas/VersionString'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    SubmitDecisionRequest:
      type: object
      additionalProperties: false
      required: [work_item_id, decision, expected_task_version, idempotency_key]
      properties:
        work_item_id:
          type: string
          minLength: 1
        decision:
          $ref: '#/components/schemas/DecisionValue'
        reason:
          type: string
          nullable: true
          description: REJECT 时必须为非空字符串。
        expected_task_version:
          $ref: '#/components/schemas/VersionString'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    ResumeApproverRequest:
      type: object
      additionalProperties: false
      required:
        - expected_instance_version
        - expected_execution_version
        - expected_assignment_version
        - idempotency_key
      properties:
        expected_instance_version:
          $ref: '#/components/schemas/VersionString'
        expected_execution_version:
          $ref: '#/components/schemas/VersionString'
        expected_assignment_version:
          $ref: '#/components/schemas/VersionString'
        expected_closed_task_version:
          $ref: '#/components/schemas/VersionString'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    CancelBlockedRequest:
      type: object
      additionalProperties: false
      required:
        - reason
        - expected_instance_version
        - expected_execution_version
        - idempotency_key
      properties:
        reason:
          type: string
          minLength: 1
        expected_instance_version:
          $ref: '#/components/schemas/VersionString'
        expected_execution_version:
          $ref: '#/components/schemas/VersionString'
        expected_task_version:
          $ref: '#/components/schemas/VersionString'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    UpgradeBindingRequest:
      type: object
      additionalProperties: false
      required:
        - reason
        - expected_document_version
        - expected_approval_binding_version
        - idempotency_key
      properties:
        reason:
          type: string
          minLength: 1
        expected_document_version:
          $ref: '#/components/schemas/VersionString'
        expected_approval_binding_version:
          $ref: '#/components/schemas/VersionString'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    ReassignWorkItemRequest:
      type: object
      additionalProperties: false
      required: [expected_task_version, target_user_id, reason, idempotency_key]
      properties:
        expected_task_version:
          $ref: '#/components/schemas/VersionString'
        target_user_id:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    CloseWorkItemRequest:
      type: object
      additionalProperties: false
      required: [expected_task_version, reason_code, idempotency_key]
      properties:
        expected_task_version:
          $ref: '#/components/schemas/VersionString'
        reason_code:
          type: string
          minLength: 1
        comment:
          type: string
        replacement_work_item_id:
          type: string
          minLength: 1
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    DefinitionCatalogItem:
      type: object
      required:
        - document_type
        - document_type_label
        - approval_requirement
        - configuration_status
        - allowed_actions
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentType'
        document_type_label:
          type: string
        approval_requirement:
          $ref: '#/components/schemas/ApprovalRequirement'
        published_version:
          type: integer
          minimum: 1
          nullable: true
        draft_version:
          type: integer
          minimum: 1
          nullable: true
        configuration_status:
          $ref: '#/components/schemas/DefinitionConfigurationStatus'
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionAllowedAction'
    DefinitionVersionItem:
      type: object
      required: [definition_id, definition_version, status, name, definition_lock_version]
      properties:
        definition_id:
          type: string
        definition_version:
          type: integer
          minimum: 1
        status:
          type: string
        name:
          type: string
        definition_lock_version:
          $ref: '#/components/schemas/VersionString'
    DefinitionNodeView:
      type: object
      required:
        - node_id
        - node_key
        - node_name
        - node_type
        - display_order
        - assignee_user_id
        - assignee_name_snapshot
      properties:
        node_id:
          type: string
        node_key:
          type: string
        node_name:
          type: string
        node_type:
          type: string
          enum: [USER_APPROVAL]
        node_purpose:
          type: string
          nullable: true
        display_order:
          type: integer
          minimum: 1
        assignee_user_id:
          type: string
        assignee_name_snapshot:
          type: string
    DefinitionDetailView:
      type: object
      required:
        - definition_id
        - document_type
        - document_type_label
        - name
        - definition_version
        - status
        - entry_node_key
        - definition_lock_version
        - nodes
        - created_by
      properties:
        definition_id:
          type: string
        document_type:
          $ref: '#/components/schemas/DocumentType'
        document_type_label:
          type: string
        name:
          type: string
        definition_version:
          type: integer
          minimum: 1
        status:
          type: string
        entry_node_key:
          type: string
        definition_lock_version:
          $ref: '#/components/schemas/VersionString'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DefinitionNodeView'
        created_by:
          type: string
        published_by:
          type: string
          nullable: true
        published_at:
          type: integer
          format: int64
          nullable: true
        retired_by:
          type: string
          nullable: true
        retired_at:
          type: integer
          format: int64
          nullable: true
    AssigneeCandidate:
      type: object
      required: [user_id, name]
      properties:
        user_id:
          type: string
        name:
          type: string
    OpenTaskSummary:
      type: object
      required: [work_item_id, task_version, owner_user_id]
      properties:
        work_item_id:
          type: string
        task_version:
          $ref: '#/components/schemas/VersionString'
        owner_user_id:
          type: string
    ApprovalCommandView:
      type: object
      required:
        - instance_id
        - instance_status
        - current_round_no
        - outcome
      properties:
        instance_id:
          type: string
        instance_status:
          $ref: '#/components/schemas/InstanceStatus'
        current_round_no:
          type: integer
          minimum: 1
        current_node_key:
          type: string
          nullable: true
        current_node_name:
          type: string
          nullable: true
