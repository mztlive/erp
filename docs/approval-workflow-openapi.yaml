      required: [status, errorMessage, success]
      properties:
        status:
          type: integer
        errorMessage:
          type: string
        code:
          type: string
        data:
          type: object
          nullable: true
          description: 403/404/500 必须为 null。
        success:
          type: boolean
          enum: [false]
    ConflictData:
      type: object
      required: [correlation_id]
      properties:
        correlation_id:
          type: string
        latest_instance_version:
          $ref: '#/components/schemas/VersionString'
        latest_task_version:
          $ref: '#/components/schemas/VersionString'
        latest_definition_lock_version:
          $ref: '#/components/schemas/VersionString'
    ConflictEnvelope:
      type: object
      required: [status, errorMessage, code, data, success]
      properties:
        status:
          type: integer
          enum: [409]
        errorMessage:
          type: string
        code:
          type: string
          enum:
            - APPROVAL_PROCESS_NOT_CONFIGURED
            - APPROVAL_DRAFT_SOURCE_NOT_AVAILABLE
            - APPROVAL_DEFINITION_NOT_DRAFT
            - APPROVAL_DEFINITION_VERSION_CONFLICT
            - APPROVAL_DEFINITION_BINDING_CORRUPTED
            - APPROVAL_ALREADY_STARTED
            - APPROVAL_TASK_NOT_OPEN
            - APPROVAL_TASK_VERSION_CONFLICT
            - APPROVAL_INSTANCE_VERSION_CONFLICT
            - APPROVAL_EXECUTION_VERSION_CONFLICT
            - APPROVAL_SUBJECT_VERSION_CONFLICT
            - APPROVAL_INSTANCE_BLOCKED
            - APPROVAL_RESUME_NOT_ALLOWED_FOR_BLOCKER
            - APPROVAL_CURRENT_APPROVER_NOT_RECOVERED
            - APPROVAL_BLOCKED_CANCEL_NOT_ALLOWED
            - APPROVAL_GENERIC_WORK_ITEM_MUTATION_FORBIDDEN
            - APPROVAL_IDEMPOTENCY_PAYLOAD_CONFLICT
            - APPROVAL_DOCUMENT_TYPE_NOT_CUT_OVER
            - WORK_ITEM_VERSION_CONFLICT
            - WORK_ITEM_RESPONSIBILITY_CONFLICT
            - CONFLICT
        data:
          $ref: '#/components/schemas/ConflictData'
        success:
          type: boolean
          enum: [false]
