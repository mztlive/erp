  /files/{fileId}/commands/complete-upload:
    post:
      tags: [Files]
      operationId: completeFileUpload
      summary: Complete an upload and start validation and security scanning
      description: >-
        If-Match must equal the aggregate ETag from GET /files/{fileId}. This 202 is a
        file-state polling exception: data is the FileAsset in SCANNING state and Location
        identifies GET /files/{fileId}; no BackgroundJob is created. Replays must use the
        original Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/FileId'
