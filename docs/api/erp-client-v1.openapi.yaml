        - name: responsibleUserId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - name: createdAtFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: createdAtTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          description: Allowed fields are orderNo, createdAt, updatedAt, grossAmount and voucherExpiryAt.
          schema:
            type: string
            default: -updatedAt,orderNo
            maxLength: 100
      responses:
        '200':
          description: Sales order page
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [SalesOrders]
      operationId: createSalesOrderDraft
      summary: Create a stable sales order identity and its initial working copy
      description: >-
        Creating VOUCHER is allowed only after the server has opened the phase-two cutover.
        This creates a draft, not a formal sales fact. The response data is the initial
        editable working copy and its workingCopyId is the identifier required by the
        subsequent PUT /sales-orders/{salesOrderId}/draft request.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalesOrderRequest'
      responses:
        '201':
          description: Sales order draft created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderDraftResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

