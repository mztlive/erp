  /sales-orders/{salesOrderId}/draft:
    get:
      tags: [SalesOrders]
      operationId: getSalesOrderDraft
      summary: Get the active editable working copy
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/SalesOrderId'
      responses:
        '200':
          description: Active working copy
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderDraftResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [SalesOrders]
      operationId: saveSalesOrderDraft
      summary: Save the active sales order working copy using optimistic concurrency
      description: >-
        If-Match must equal the sales aggregate ETag from
        GET /sales-orders/{salesOrderId}, not an ETag inferred from draftVersion or contentHash.
        Autosave accepts an empty draft and structurally valid partial lines; missing business
        inputs are returned through validation and do not by themselves reject draft persistence.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/SalesOrderId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSalesOrderDraftRequest'
      responses:
        '200':
          description: Saved working copy and server-calculated validation
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderDraftResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales-orders/{salesOrderId}/commands/submit:
    post:
      tags: [SalesOrders]
      operationId: submitSalesOrder
      summary: Freeze the current working copy as an immutable submission
      description: >-
        If-Match must equal the sales aggregate ETag from
        GET /sales-orders/{salesOrderId}. Replays and unknown-result recovery must use the
        original Idempotency-Key and then reload that sales detail. The server rejects mixed
        line types, requires at least one GOODS_SERVICE line for goods/service submissions,
        and requires exactly one VOUCHER line with mutually exclusive voucher fields.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/SalesOrderId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSalesOrderRequest'
      responses:
        '200':
          description: Formal submission result
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormalActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          $ref: '#/components/responses/Locked'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /sales-orders/{salesOrderId}/commands/confirm-procurement:
    post:
      tags: [SalesOrders]
      operationId: confirmSalesOrderProcurement
      summary: Confirm or reject procurement feasibility for an immutable sales submission
      description: >-
        Procurement confirmation is a typed command and processing record. It is not a
        standalone business document and has no generic CRUD endpoint. A confirmed decision
        may make a goods/service sales order effective in the same transaction. If-Match
        must equal the sales aggregate ETag from GET /sales-orders/{salesOrderId}. The
        submissionId, subjectHash and submissionLineId values must come from that response's
        pendingSubmission, while workItemId and claimToken come from the claimed task.
        Replays and unknown-result recovery must use the original Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/SalesOrderId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcurementConfirmationRequest'
      responses:
        '200':
          description: Procurement confirmation result
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormalActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          $ref: '#/components/responses/Locked'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /sales-orders/{salesOrderId}/versions:
    get:
      tags: [SalesOrders]
      operationId: listSalesOrderVersions
      summary: List immutable effective sales order revisions
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/SalesOrderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Sales order revision page
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderVersionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales-orders/{salesOrderId}/versions/{revisionId}:
    get:
      tags: [SalesOrders]
      operationId: getSalesOrderVersion
      summary: Get an immutable sales order revision
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/SalesOrderId'
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Sales order revision
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrderVersionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales-orders/{salesOrderId}/version-comparisons:
    get:
      tags: [SalesOrders]
      operationId: compareSalesOrderVersions
      summary: Compare two immutable sales order revisions
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/SalesOrderId'
