          in: query
          required: true
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - name: toRevisionId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/OpaqueId'
      responses:
        '200':
          description: Grouped sales order revision differences
          headers:
