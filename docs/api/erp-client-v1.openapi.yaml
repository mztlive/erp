openapi: 3.1.0
info:
  title: ERP Browser API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Frozen browser contract between erp-client and the ERP backend. This API exposes
    ERP resources, read projections and typed business commands only. Mall source APIs,
    mall event ingestion and Supplier Connector protocols are intentionally excluded.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /api/v1
    description: Same-origin ERP browser API
security:
  - bearerAuth: []
tags:
  - name: Context
    description: Authenticated user, permissions, feature gates and cutover context.
  - name: Search
    description: Permission-filtered global search across ERP business objects.
  - name: Tasks
    description: Work item queries, claims, leases, transfers and controlled closure.
  - name: Jobs
    description: Background job progress, outcomes, cancellation and scoped resume.
  - name: BulkOperations
    description: Immutable selection previews and confirmed background execution.
  - name: Files
    description: Short-lived upload and download grants with current authorization checks.
  - name: SalesOrders
    description: Unified goods/service and voucher sales order resource and typed commands.
paths:
  /context:
    get:
      tags: [Context]
      operationId: getApplicationContext
      summary: Get the authenticated user's ERP application context
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Application context
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationContextResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /search:
    get:
      tags: [Search]
      operationId: searchAuthorizedObjects
      summary: Search objects and actions visible to the current user
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: objectType
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            uniqueItems: true
            items:
              $ref: '#/components/schemas/SearchObjectType'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Authorized search results
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List work items in the current user's authorized scope
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          required: false
          description: Allowed fields are dueAt, createdAt, priority and updatedAt.
          schema:
            type: string
            default: dueAt,-priority,createdAt
            maxLength: 100
        - name: taskType
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/TaskType'
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/TaskStatus'
        - name: ownerRoleCode
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: ownerUserId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - name: businessObjectType
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: businessObjectId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - name: dueAtFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: dueAtTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Task page
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{workItemId}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a work item and its lease/action state
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/WorkItemId'
      responses:
        '200':
          description: Work item
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{workItemId}/commands/claim:
    post:
      tags: [Tasks]
      operationId: claimTask
      summary: Atomically claim a task and obtain a short lease
      description: >-
        If-Match must equal the aggregate ETag from GET /tasks/{workItemId}.
        Replays must use the original Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Claimed task and plaintext lease token
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskLeaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{workItemId}/commands/renew-lease:
    post:
      tags: [Tasks]
      operationId: renewTaskLease
      summary: Renew a task lease using its current lease version
      description: If-Match must equal the aggregate ETag from GET /tasks/{workItemId}.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewTaskLeaseRequest'
      responses:
        '200':
          description: Renewed lease
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskLeaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{workItemId}/commands/release:
    post:
      tags: [Tasks]
      operationId: releaseTask
      summary: Release the current user's task lease without changing business facts
      description: If-Match must equal the aggregate ETag from GET /tasks/{workItemId}.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseTaskRequest'
      responses:
        '200':
          description: Released task
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{workItemId}/commands/transfer:
    post:
      tags: [Tasks]
      operationId: transferTask
      summary: Transfer a task by closing the current lease and creating a successor task
      description: >-
        If-Match must equal the aggregate ETag from GET /tasks/{workItemId}.
        Replays must use the original Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferTaskRequest'
      responses:
        '200':
          description: Original and successor task references
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTransferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{workItemId}/commands/close:
    post:
      tags: [Tasks]
      operationId: closeTask
      summary: Close a duplicate, misassigned or formally replaced task
      description: >-
        If-Match must equal the aggregate ETag from GET /tasks/{workItemId}.
        Replays must use the original Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseTaskRequest'
      responses:
        '200':
          description: Closed task; no business document state is changed
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /jobs:
    get:
      tags: [Jobs]
      operationId: listBackgroundJobs
      summary: List background jobs visible to the current user
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/BackgroundJobStatus'
        - name: jobType
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: initiatedByUserId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OpaqueId'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: -createdAt
            enum: [createdAt, -createdAt, updatedAt, -updatedAt]
      responses:
        '200':
          description: Background job page
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundJobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getBackgroundJob
      summary: Get a background job
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Background job
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /jobs/{jobId}/items:
    get:
      tags: [Jobs]
      operationId: listBackgroundJobItems
      summary: List per-object job outcomes
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/BackgroundJobItemStatus'
      responses:
        '200':
          description: Job item page
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundJobItemListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /jobs/{jobId}/commands/cancel:
    post:
      tags: [Jobs]
      operationId: cancelBackgroundJob
      summary: Cancel a cancellable background job
      description: >-
        If-Match must equal the aggregate ETag from GET /jobs/{jobId}.
        Replays must use the original Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobControlRequest'
      responses:
        '200':
          description: Updated background job
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /jobs/{jobId}/commands/resume:
    post:
      tags: [Jobs]
      operationId: resumeBackgroundJob
      summary: Resume a failed job using its immutable original scope
      description: >-
        If-Match must equal the aggregate ETag from GET /jobs/{jobId}.
        Replays must use the original Idempotency-Key and immutable original scope.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobControlRequest'
      responses:
        '202':
          description: Resumed background job
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /bulk-previews:
    post:
      tags: [BulkOperations]
      operationId: createBulkPreview
      summary: Freeze a bulk selection and calculate its impact without changing business data
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkPreviewRequest'
      responses:
        '201':
          description: Immutable bulk preview
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /bulk-previews/{selectionSnapshotId}:
    get:
      tags: [BulkOperations]
      operationId: getBulkPreview
      summary: Get an immutable bulk selection preview
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/SelectionSnapshotId'
      responses:
        '200':
          description: Bulk preview
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPreviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalError'

  /bulk-previews/{selectionSnapshotId}/commands/confirm:
    post:
      tags: [BulkOperations]
      operationId: confirmBulkPreview
      summary: Confirm a frozen bulk preview and start a background job
      description: >-
        If-Match must equal the aggregate ETag from
        GET /bulk-previews/{selectionSnapshotId}. Replays must use the original
        Idempotency-Key and cannot expand the immutable selection.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/SelectionSnapshotId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmBulkPreviewRequest'
      responses:
        '202':
          description: Background job created for the frozen selection
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /files/upload-intents:
    post:
      tags: [Files]
      operationId: createFileUploadIntent
      summary: Create a short-lived upload authorization
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileUploadIntentRequest'
      responses:
        '201':
          description: Upload intent
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
