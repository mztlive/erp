        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access-token

  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Strong aggregate ETag from the GET named by the write operation. The client must
        not substitute a list-item version, draft hash or ETag from another resource.
      schema:
        type: string
        minLength: 3
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[!-~]+$'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        enum: [20, 50, 100]
        default: 50
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    SelectionSnapshotId:
      name: selectionSnapshotId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    SalesOrderId:
      name: salesOrderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'

  headers:
    XRequestId:
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ETag:
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 200
    Location:
      required: true
      schema:
        type: string
        pattern: '^/api/v1/'
        maxLength: 1000
    IdempotencyReplayed:
      required: false
      schema:
        type: boolean
    RetryAfter:
      required: false
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Malformed request, missing required control header or unsupported query value
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing, invalid or expired
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Page, action, data-scope or field permission denied
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The stable object identifier does not exist for this resource type
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Business state, lease, draft version or idempotency conflict
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: A short-lived selection, file grant or result has expired
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: If-Match does not match the current strong ETag
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: The declared or uploaded file exceeds the allowed size
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Content type or file type is not allowed for the declared purpose
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Field or cross-field request validation failed
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Locked:
      description: The object is frozen by an ownership migration or maintenance operation
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Request rate exceeded
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected ERP service failure
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: ERP or an explicitly required dependency is temporarily unavailable
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: A required downstream gateway returned an invalid or unknown result
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: The command result is unknown after a gateway timeout; recover by original intent
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 128
      description: Stable opaque ERP identifier. Clients must not parse this value.
    Decimal2:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$'
      examples: ['48000.00']
    UnitPriceDecimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{1,4})?$'
      examples: ['480.0000']
    QuantityDecimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
      examples: ['10.5']
    RateDecimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
      examples: ['0.13']
    CurrencyCode:
      type: string
      enum: [CNY]
    MoneySummary:
      type: object
      additionalProperties: false
      required: [currency, grossAmount, netAmount, taxAmount]
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        grossAmount:
          $ref: '#/components/schemas/Decimal2'
        netAmount:
          $ref: '#/components/schemas/Decimal2'
        taxAmount:
          $ref: '#/components/schemas/Decimal2'
    ApiWarning:
      type: object
      additionalProperties: false
      required: [code, message, fieldPaths]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,79}$'
        message:
          type: string
          minLength: 1
          maxLength: 500
        fieldPaths:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId, dataAsOf, warnings]
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        dataAsOf:
          type: string
          format: date-time
        warnings:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ApiWarning'
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          enum: [20, 50, 100]
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    BusinessObjectReference:
      type: object
      additionalProperties: false
      required: [objectType, id, number, title]
      properties:
        objectType:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,79}$'
        id:
          $ref: '#/components/schemas/OpaqueId'
        number:
          type: [string, 'null']
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 200
    UserReference:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    RoleReference:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 100
    PartyReference:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        code:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
    ContractReference:
      type: object
      additionalProperties: false
      required: [id, contractNo, name]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        contractNo:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
    ActionRisk:
      type: string
      enum: [NORMAL, CAUTION, HIGH]
    AllowedAction:
      type: object
      additionalProperties: false
      required:
        - code
        - label
        - httpMethod
        - href
        - requiresReason
        - requiresIfMatch
        - requiresIdempotencyKey
        - risk
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,99}$'
        label:
          type: string
          minLength: 1
          maxLength: 100
        httpMethod:
          type: string
          enum: [POST, PUT]
        href:
          type: string
          pattern: '^/api/v1/'
          maxLength: 500
        requiresReason:
          type: boolean
        requiresIfMatch:
          type: boolean
        requiresIdempotencyKey:
          type: boolean
        risk:
          $ref: '#/components/schemas/ActionRisk'
    ActionBlockerCategory:
      type: string
      enum:
        - VALIDATION
        - BUSINESS_STATE
        - PERMISSION
        - DATA_SCOPE
        - SEGREGATION_OF_DUTIES
        - CONCURRENCY
        - DATA_FRESHNESS
        - MAINTENANCE
        - DEPENDENCY
    NextResponsibility:
      type: object
      additionalProperties: false
      required: [trackCode, role, owner, dueAt, actionCode, status]
      properties:
        trackCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,79}$'
        role:
          $ref: '#/components/schemas/RoleReference'
        owner:
          oneOf:
            - $ref: '#/components/schemas/UserReference'
            - type: 'null'
        dueAt:
          type: [string, 'null']
          format: date-time
        actionCode:
          type: [string, 'null']
          maxLength: 100
        status:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,79}$'
    ActionBlocker:
      type: object
      additionalProperties: false
      required: [actionCode, code, category, message, fieldPaths, nextResponsibility]
      properties:
        actionCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,99}$'
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,99}$'
        category:
          $ref: '#/components/schemas/ActionBlockerCategory'
        message:
          type: string
          minLength: 1
          maxLength: 500
        fieldPaths:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
        nextResponsibility:
          oneOf:
            - $ref: '#/components/schemas/NextResponsibility'
            - type: 'null'
    StatusValue:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,79}$'
        label:
          type: string
          minLength: 1
          maxLength: 100
    StatusChange:
      type: object
      additionalProperties: false
      required: [axis, from, to]
      properties:
        axis:
          type: string
          pattern: '^[a-z][A-Za-z0-9]{1,79}$'
        from:
          oneOf:
            - $ref: '#/components/schemas/StatusValue'
            - type: 'null'
        to:
          $ref: '#/components/schemas/StatusValue'
    GeneratedVersionReference:
      type: object
      additionalProperties: false
      required: [id, revisionNo, contentHash]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        revisionNo:
          type: integer
          minimum: 1
        contentHash:
          type: string
          minLength: 16
          maxLength: 256
    FormalActionResult:
      type: object
      additionalProperties: false
      required:
        - aggregate
        - statusChanges
        - generatedDocuments
        - generatedVersion
        - downstreamTasks
        - nextResponsibilities
        - backgroundJobId
      properties:
        aggregate:
          $ref: '#/components/schemas/BusinessObjectReference'
        statusChanges:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/StatusChange'
        generatedDocuments:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/BusinessObjectReference'
        generatedVersion:
          oneOf:
            - $ref: '#/components/schemas/GeneratedVersionReference'
            - type: 'null'
        downstreamTasks:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/BusinessObjectReference'
        nextResponsibilities:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/NextResponsibility'
        backgroundJobId:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
    FormalActionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/FormalActionResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    DeploymentStage:
      type: string
      enum:
        - PHASE_1
        - PHASE_2_PREPARATION
        - PHASE_2_MAINTENANCE
        - PHASE_2_OPEN
    ApplicationFeatures:
      type: object
      additionalProperties: false
      required:
        - deploymentStage
        - maintenanceMode
        - mallPhase1PollingEnabled
        - ownershipMigrationEnabled
        - voucherSalesCreationEnabled
        - supplierAutomationEnabled
        - cutoverAt
      properties:
        deploymentStage:
          $ref: '#/components/schemas/DeploymentStage'
        maintenanceMode:
          type: boolean
        mallPhase1PollingEnabled:
          type: boolean
        ownershipMigrationEnabled:
          type: boolean
        voucherSalesCreationEnabled:
          type: boolean
        supplierAutomationEnabled:
          type: boolean
        cutoverAt:
          type: [string, 'null']
          format: date-time
    ApplicationContext:
      type: object
      additionalProperties: false
      required:
        - user
        - roles
        - permissionCodes
        - pageCodes
        - dataScopeDigest
        - businessTimezone
        - features
      properties:
        user:
          $ref: '#/components/schemas/UserReference'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleReference'
        permissionCodes:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_:.]{2,119}$'
        pageCodes:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^ERP-[A-Z]{2,3}-[0-9]{3}$'
        dataScopeDigest:
          type: string
          minLength: 16
          maxLength: 256
        businessTimezone:
          type: string
          enum: [Asia/Shanghai]
        features:
          $ref: '#/components/schemas/ApplicationFeatures'
    ApplicationContextResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ApplicationContext'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    SearchObjectType:
      type: string
      enum:
        - CUSTOMER
        - SUPPLIER
        - CONTRACT
        - SALES_ORDER
        - PURCHASE_ORDER
        - PRODUCT
        - SKU
        - TASK
    SearchResult:
      type: object
      additionalProperties: false
      required:
        - objectType
        - id
        - number
        - title
        - subtitle
        - pageRoute
        - allowedActions
      properties:
        objectType:
          $ref: '#/components/schemas/SearchObjectType'
        id:
          $ref: '#/components/schemas/OpaqueId'
        number:
          type: [string, 'null']
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 200
        subtitle:
          type: [string, 'null']
          maxLength: 300
        pageRoute:
          type: string
          pattern: '^/'
          maxLength: 500
        allowedActions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AllowedAction'
    SearchResultSet:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SearchResult'
    SearchResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SearchResultSet'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ErrorCategory:
      type: string
      enum:
        - REQUEST
        - AUTHENTICATION
        - AUTHORIZATION
        - VALIDATION
        - BUSINESS_BLOCKED
        - CONCURRENCY
        - IDEMPOTENCY
        - MAINTENANCE
        - SYNC_EXTERNAL
        - QUERY_MODEL
        - SYSTEM
    ErrorCode:
      type: string
      enum:
        - REQUEST_MALFORMED
        - QUERY_PARAMETER_INVALID
        - HEADER_REQUIRED
        - UNSUPPORTED_MEDIA_TYPE
        - AUTHENTICATION_REQUIRED
        - AUTHENTICATION_EXPIRED
        - PERMISSION_DENIED
        - DATA_SCOPE_DENIED
        - FIELD_ACCESS_DENIED
        - OBJECT_NOT_FOUND
        - VALIDATION_FAILED
        - FIELD_REQUIRED
        - INVALID_FORMAT
        - DECIMAL_SCALE_EXCEEDED
        - DATE_RANGE_INVALID
        - MONEY_NOT_BALANCED
        - VOUCHER_LINE_COUNT_INVALID
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - FILE_SECURITY_SCAN_FAILED
        - FILE_NOT_READY
        - ACTION_NOT_ALLOWED
        - STATE_TRANSITION_NOT_ALLOWED
        - BUSINESS_INVARIANT_VIOLATION
        - DEPENDENCY_NOT_READY
        - SUBJECT_HASH_MISMATCH
        - SEGREGATION_OF_DUTIES_VIOLATION
        - DATA_FRESHNESS_REQUIRED
        - OWNER_SYSTEM_READ_ONLY
        - VOUCHER_CUTOVER_NOT_OPEN
        - TASK_LEASE_REQUIRED
        - TASK_LEASE_LOST
        - TASK_NOT_CLOSABLE
        - JOB_NOT_CANCELLABLE
        - SELECTION_SCOPE_CHANGED
        - DUPLICATE_EXTERNAL_IDENTITY
        - MAPPING_REQUIRED
        - ETAG_MISMATCH
        - DRAFT_VERSION_CONFLICT
        - CONTENT_HASH_CONFLICT
        - RESOURCE_BUSY
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_INVALID
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENT_REQUEST_IN_PROGRESS
        - SELECTION_SNAPSHOT_EXPIRED
        - DOWNLOAD_GRANT_EXPIRED
        - MAINTENANCE_WINDOW_ACTIVE
        - OBJECT_FROZEN_FOR_MIGRATION
        - EXTERNAL_DEPENDENCY_UNAVAILABLE
        - EXTERNAL_RATE_LIMITED
        - EXTERNAL_AUTHENTICATION_FAILED
        - EXTERNAL_RESULT_UNKNOWN
        - SYNC_WATERMARK_CONFLICT
        - SOURCE_DATA_MAPPING_FAILED
        - QUERY_MODEL_NOT_READY
        - QUERY_MODEL_STALE
        - SEARCH_INDEX_UNAVAILABLE
        - REPORT_SCOPE_TOO_LARGE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - GATEWAY_TIMEOUT
    FrontendAction:
      type: string
      enum:
        - NONE
        - FIX_INPUT
        - LOGIN
        - REQUEST_ACCESS
        - RELOAD
        - RELOAD_AND_COMPARE
        - RECLAIM_TASK
        - RETRY
        - RETRY_SAME_IDEMPOTENCY_KEY
        - POLL_RESULT
        - WAIT
        - REFRESH_QUERY
        - OPEN_TASK
        - OPEN_ERROR_CENTER
        - RESELECT_SCOPE
        - UPLOAD_AGAIN
        - NARROW_FILTERS
        - CONTACT_ADMIN
    FieldError:
      type: object
      additionalProperties: false
      required: [fieldPath, code, message]
      properties:
        fieldPath:
          type: string
          minLength: 1
          maxLength: 200
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          maxLength: 500
    ErrorBlocker:
      type: object
      additionalProperties: false
      required: [code, message, actionCode, nextResponsibility]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          maxLength: 500
        actionCode:
          type: [string, 'null']
          maxLength: 100
        nextResponsibility:
          oneOf:
            - $ref: '#/components/schemas/NextResponsibility'
            - type: 'null'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key:
          type: string
          pattern: '^[a-z][A-Za-z0-9]{1,79}$'
        value:
          type: string
          maxLength: 500
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - category
        - message
        - fieldErrors
        - blockers
        - retryable
        - frontendAction
        - requestId
        - details
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        category:
          $ref: '#/components/schemas/ErrorCategory'
        message:
          type: string
          minLength: 1
          maxLength: 500
        fieldErrors:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FieldError'
        blockers:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ErrorBlocker'
        retryable:
          type: boolean
        frontendAction:
          $ref: '#/components/schemas/FrontendAction'
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        details:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'

    TaskType:
      type: string
      enum:
        - PROCUREMENT_CONFIRMATION
        - LOW_MARGIN_MANAGER_CONFIRMATION
        - PURCHASE_ORDER_REVIEW
        - CARD_FUNDS_REVIEW
        - CARD_FUNDS_DELTA_REVIEW
        - CARD_SALES_MANAGER_APPROVAL
        - CARD_SALES_OPERATION_APPROVAL
        - OWNERSHIP_MIGRATION_SALES_CONFIRMATION
        - OWNERSHIP_MIGRATION_FINANCE_CONFIRMATION
        - INVENTORY_ADJUSTMENT_REVIEW
        - FINANCE_CORRECTION_REVIEW
        - SUPPLIER_SETTLEMENT_REVIEW
        - INTEGRATION_RESULT_UNKNOWN
        - BUSINESS_EXCEPTION
    TaskStatus:
      type: string
      enum: [UNCLAIMED, PENDING, IN_PROGRESS, COMPLETED, TRANSFERRED, CLOSED]
    TaskPriority:
      type: string
      enum: [LOW, NORMAL, HIGH, URGENT]
    TaskSubjectType:
      type: string
      enum:
        - SALES_ORDER_SUBMISSION
        - PURCHASE_ORDER_SUBMISSION
        - RECEIVABLE_FUNDS_REVIEW
        - OWNERSHIP_MIGRATION_CHECKLIST
        - STOCK_ADJUSTMENT_SUBMISSION
        - FINANCE_CORRECTION_DOCUMENT
        - SUPPLIER_SETTLEMENT_SUBMISSION
        - INTEGRATION_ACTION
        - BUSINESS_EXCEPTION_FACT
    TaskSubjectReference:
      type: object
      additionalProperties: false
      required: [type, id, version, hash, href]
      properties:
        type:
          $ref: '#/components/schemas/TaskSubjectType'
        id:
          $ref: '#/components/schemas/OpaqueId'
        version:
          type: string
          minLength: 1
          maxLength: 100
        hash:
          type: string
          minLength: 16
          maxLength: 256
        href:
          type: string
          pattern: '^/'
          maxLength: 500
          description: >-
            Authorized browser page route for the subject. A sales submission points to
            /sales-orders/{salesOrderId}, where pendingSubmission exposes the immutable subject.
    TaskClaimState:
      type: object
      additionalProperties: false
      required: [claimedBy, leaseExpiresAt, leaseVersion]
      properties:
        claimedBy:
          $ref: '#/components/schemas/UserReference'
        leaseExpiresAt:
          type: string
          format: date-time
        leaseVersion:
          type: integer
          minimum: 1
    Task:
      type: object
      additionalProperties: false
      required:
        - id
        - taskType
        - businessObject
        - subjectRef
        - status
        - ownerRole
        - ownerUser
        - priority
        - createdAt
        - dueAt
        - reasonCode
        - impactSummary
        - completionAction
        - claim
        - transferredFromWorkItemId
        - transferredToWorkItemId
        - allowedActions
        - actionBlockers
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        taskType:
          $ref: '#/components/schemas/TaskType'
        businessObject:
          $ref: '#/components/schemas/BusinessObjectReference'
        subjectRef:
          $ref: '#/components/schemas/TaskSubjectReference'
        status:
          $ref: '#/components/schemas/TaskStatus'
        ownerRole:
