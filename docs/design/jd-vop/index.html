:var(--muted)}.metric .value{font-size:28px;font-weight:600;line-height:1.6;letter-spacing:-.8px}.metric .unit{font-size:13px;font-weight:400;margin-left:4px;color:var(--muted)}.metric .note{font-size:11px;color:var(--muted)}.inline-stats{display:flex;align-items:baseline;gap:24px;flex-wrap:wrap}.inline-stats strong{font-size:24px;font-weight:600;margin-right:4px}.table-wrap{overflow:auto;max-width:100%}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th{text-align:left;padding:11px 16px;font-size:12px;color:var(--muted);background:#fafafa;font-weight:500;border-bottom:1px solid var(--border)}td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:top}tr:last-child td{border-bottom:0}td small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.table-toolbar{padding:11px 16px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px}.filter{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:18px 20px}.filter .field{min-width:160px;flex:1}.filter .field.search{flex:2}.split{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}.preview{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden}.preview-head{padding:24px 24px 20px;border-bottom:1px solid var(--border)}.preview h2{font-size:20px;line-height:1.5;margin-top:8px}.preview-price{font-size:32px;font-weight:600;line-height:1.4}.preview-body{padding:20px 24px;display:grid;gap:20px}.preview .kv{grid-template-columns:repeat(2,minmax(0,1fr))}.preview-foot{border-top:1px solid var(--border);padding:16px 20px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.product-illustration{width:64px;height:64px;border:1px solid #e5dfd6;background:#f8f5ef;display:flex;align-items:center;justify-content:center;flex:none;border-radius:8px;color:#8c7150;font-size:11px;position:relative}.product-illustr lex;gap:24px;font-size:12px;flex-wrap:wrap}.leaf .line span{color:var(--muted)}.progress{height:6px;background:#ededf0;overflow:hidden;border-radius:8px;display:flex;margin-top:10px}.progress span{background:#4f8765}.progress .light{background:#b8d5c3}.aside-note{border-left:2px solid var(--border);padding-left:14px;color:var(--muted);font-size:12px}.timeline{list-style:none;padding:0;margin:0}.timeline li{border-left:1px solid var(--border);padding:0 0 18px 18px;margin-left:5px;position:relative;font-size:12px}.timeline li:before{content:"";position:absolute;left:-4px;top:7px;width:7px;height:7px;border-radius:50%;background:#a1a1aa}.timeline li:last-child{padding-bottom:0}.timeline time{display:block;font-size:11px;color:var(--muted)}.permission-strip{padding:10px 16px;background:#fafafa;border:1px dashed #d4d4d8;border-radius:8px;font-size:12px;color:var(--muted)}.empty{padding:38px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;bottom:24px;right:24px;max-width:440px;padding:14px 20px;background:#18181b;color:#fff;border-radius:10px;box-shadow:0 8px 30px #0002;z-index:10;font-size:13px}.toast[hidden]{display:none}.design-footer{padding-top:22px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.view[hidden]{display:none}.check{width:15px;height:15px;accent-color:#18181b}.modal-backdrop{position:fixed;inset:0;background:#0003;z-index:20;display:grid;place-items:center;padding:24px}.modal-backdrop[hidden]{display:none}.modal{max-width:620px;width:100%;border-radius:14px;background:#fff;box-shadow:0 20px 80px #0002;overflow:hidden}.modal .body{padding:24px}.modal h2{font-size:20px}.modal .foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
    @media(min-width:1600px){.content{padding-top:30px}.split{grid-template-columns:minmax(0,1fr) 400px}}@media(max-width:1100px){.app{grid-template-columns:176px minmax(0,1fr)}.split{grid-template-columns:1fr}.preview{max-width:none}.preview-body{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid3{gap:16px}.content{padding:24px}.statebar{padding:10px 24px}.metric{padding:0 15px}.metric .value{font-size:23px}}@media(max-width:760px){.app{display:block}.sidebar{padding:12px;border-right:0;border-bottom:1px solid var(--border);gap:12px}.sidebar .brand,.side-label,.side-foot{display:none}.sidebar nav{display:flex;overflow:auto;gap:5px}.navbtn{white-space:nowrap;padding:7px 9px}.topbar{padding:0 18px}.content{padding:20px 16px}.designbar{padding:10px 16px}.statebar{padding:10px 16px}.statebar label{flex-wrap:wrap}.statebar select{max-width:100%;min-width:0}.grid2,.grid3,.kv{grid-template-columns:1fr}.metric-strip{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}.metric:nth-child(3){border-left:0}.metric .value{font-size:25px}.section,.panel-inner{padding:18px}.section-head{gap:14px}.preview-body{grid-template-columns:1fr}.form-foot{padding:16px 18px}.tree-child{margin-left:8px;padding-left:13px}.tree-child .leaf:before{left:-14px;width:13px}.notice{padding:14px}.toast{left:16px;right:16px;bottom:16px}.design-footer{font-size:10px}}

<body>
  <header class="designbar"><div><strong>京东 VOP · 页面状态设计</strong> <span>　设计样例 · 实现基线 · 不连接业务系统</span></div><a id="design-contract-link" href="README.md">查看页面执行约定 ↗</a></header>
  <div class="app">
    <aside class="sidebar" aria-label="设计页面导航">
      <div class="brand">福尚云 ERP <small>设计</small></div>
      <div><p class="side-label">供应商 API</p><nav>
        <button id="nav-connection" class="navbtn" data-view="connection" aria-current="page"><span class="navicon">◈</span>连接设置</button>
        <button id="nav-catalog" class="navbtn" data-view="catalog"><span class="navicon">▦</span>商品库</button>
      </nav></div>
      <div><p class="side-label">采购与履约</p><nav>
        <button id="nav-address" class="navbtn" data-view="address"><span class="navicon">⌖</span>履约资料补齐</button>
        <button id="nav-order" class="navbtn" data-view="order"><span class="navicon">⊞</span>采购履约</button>
      </nav></div>
      <div><p class="side-label">财务</p><nav><button id="nav-funds" class="navbtn" data-view="funds"><span class="navicon">▤</span>供应商预存款</button></nav></div>
      <div><p class="side-label">销售</p><nav><button id="nav-sales" class="navbtn" data-view="sales"><span class="navicon">▥</span>销售交付</button></nav></div>
      <p class="side-foot">左侧用于浏览设计。<br>实际入口沿用原业务导航。</p>
    </aside>
    <main class="workspace">
      <div class="topbar"><span class="crumb" id="breadcrumb">供应商 API / API 连接</span><div class="row gap8"><span class="muted small">演示公司</span><span class="avatar" aria-label="示例用户">陈</span></div></div>
      <div class="statebar"><label for="design-state"><span class="label">设计状态</span><select id="design-state"></select></label><span class="muted" id="state-caption">切换状态查看不同业务条件下的页面。</span></div>
      <div class="content">
        <section class="view" id="view-connection" aria-label="连接设置设计"></section>
        <section class="view" id="view-catalog" aria-label="商品库设计" hidden></section>
        <section class="view" id="view-address" aria-label="履约资料补齐设计" hidden></section>
        <section class="view" id="view-order" aria-label="采购履约设计" hidden></section>
        <section class="view" id="view-funds" aria-label="预存款账户设计" hidden></section>
        <section class="view" id="view-sales" aria-label="销售交付设计" hidden></section>
        <footer class="design-footer"><span>所有名称、业务单号、数量和金额均为设计样例，不代表已取得接口授权或已发生业务。</span><span>页面确认范围：信息层级、状态、操作及权限展示</span></footer>
      </div>
    </main>
  </div>
  <div id="design-toast" class="toast" role="status" hidden></div>
  <div id="design-modal" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="design-modal-title"><div class="body" id="design-modal-body"></div><div class="foot"><button id="design-modal-close" class="btn">关闭</button><button id="design-modal-confirm" class="btn primary">确认（设计演示）</button></div></section></div>
  <script>
    const $ = (selector) => document.querySelector(selector);
    const badge = (text, tone = '') => `<span class="badge ${tone}">${text}</span>`;
    const button = (id, text, action = 'demo', style = '', disabled = false) => `<button id="${id}" class="btn ${style}" data-action="${action}"${disabled ? ' disabled' : ''}>${text}</button>`;
    const notice = (title, text, tone = 'warning', action = '') => `<div class="notice ${tone}"><span class="symbol" aria-hidden="true">!</span><div class="body"><h3>${title}</h3><p class="small muted">${text}</p>${action ? `<div class="row">${action}</div>` : ''}</div></div>`;
    const header = (title, subtitle, status = '', actions = '', back = '') => `<header class="page-head">${back ? `<p class="back">← ${back}</p>` : ''}<div class="row between"><div><div class="row"><h1>${title}</h1>${status}</div><p class="subtitle">${subtitle}</p></div><div class="row">${actions}</div></div></header>`;
    const tabs = (items, active) => `<div class="tabs">${items.map(([key, label]) => `<button id="${active}-tab-${key}" class="tab ${key === active ? 'active' : ''}" data-action="tab-demo">${label}</button>`).join('')}</div>`;
    const kv = (items) => `<dl class="kv">${items.map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>`;
    const metric = (label, value, note = '', unit = '') => `<div class="metric"><div class="label">${label}</div><div class="value num">${value}${unit ? `<span class="unit">${unit}</span>` : ''}</div><p class="note">${note}</p></div>`;
    const states = {
      connection: [['ready','只读可用 · 新增下单关闭'],['missing','部署配置缺失'],['expired','接口授权失效'],['delayed','消息延迟 · 账户待核对']],
      catalog: [['ready','有报价 · 有采购限制'],['missing','缺报价 · 规格待核验'],['restricted','附加服务 · 阻断自动下单'],['masked','无成本查看权限']],
      address: [['ambiguous','地址转换存在多个候选'],['missing','缺少第四级地址'],['confirmed','已确认 · 按当前数量核验'],['changed','地址或数量发生变化']],
      order: [['partial','部分确认 · 部分发货'],['unknown','确认结果未知'],['freight','运费超过已批准范围'],['funds','资金占用不足'],['cancel','部分取消 · 返款待核实']],
      funds: [['active','已占用 · 部分扣款已核销'],['topup','银行已付款 · 充值未到账'],['authorization','付款已批准 · 自动授权失效'],['refund','子单已取消 · 返款未到账'],['reconcile','账户对账差异 · 暂停新增使用']],
      sales: [['partial','部分发货 · 交付进度'],['masked','销售角色 · 不可查看采购成本'],['change','交付变更受已有供应商订单约束']]
    };
    const captions = {connection:'既有 API 设置入口',catalog:'既有商品库与选品流程',address:'采购履约资料补齐入口',order:'原采购详情 · 履约分区',funds:'供应商往来 · 预存款账户',sales:'原销售详情 · 交付分区'};
    let currentView = 'connection';
    let toastTimer;
    let focusBeforeModal;

    function renderConnection(state) {
      const configured = state !== 'missing';
      const healthy = state === 'ready';
      const blocking = state === 'missing'

      currentView = view;
      document.querySelectorAll('.view').forEach((section) => { section.hidden = section.id !== `view-${view}`; });
      document.querySelectorAll('[data-view]').forEach((nav) => {
        if (nav.dataset.view === view) nav.setAttribute('aria-current','page'); else nav.removeAttribute('aria-current');
      });
      $(`#view-${view}`).innerHTML = renderers[view](state);
      $('#breadcrumb').textContent = captions[view];
      $('#state-caption').textContent = '所有操作均为本地设计演示';
      $('#design-state').innerHTML = states[view].map(([value,label]) => `<option value="${value}"${state === value ? ' selected' : ''}>${label}</option>`).join('');
      history.replaceState(null,'',`#${view}/${state}`);
    }
    function toast(text) {
      $('#design-toast').textContent = text;
      $('#design-toast').hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { $('#design-toast').hidden = true; },4200);
    }
    const modalContent = {
      topup: ['登记充值付款', '<p class="muted small mt8">先关联已批准的充值申请和实际银行付款；供应商到账核实后才形成可用资金。</p><div class="grid2 mt24"><div class="field"><label class="label" for="modal-topup-request">充值申请</label><select id="modal-topup-request"><option>CZS20261029-0004 · 已批准</option></select></div><div class="field"><label class="label" for="modal-topup-amount">充值金额（元）</label><input id="modal-topup-amount" value="5,000.00" readonly></div></div><div class="field mt16"><label class="label" for="modal-topup-payment">实际银行付款</label><select id="modal-topup-payment"><option>YF20261029-0011 · 5,000.00 元</option></select><p class="help">记录来源唯一，同一笔银行付款不能重复登记。</p></div>'],
      'topup-check': ['核对充值到账', '<p class="muted small mt8">充值批次 CZ20261029-0004 · 银行已付款 5,000.00 元</p><div class="divider"></div><div class="field"><label class="label" for="modal-topup-evidence">供应商入账凭据</label><select id="modal-topup-evidence"><option>尚未取得可核实的到账证据</option></select><p class="help">申请批准、银行已付或余额增加不能单独证明本笔充值到账。</p></div><p class="small muted mt16">到账核对完成前保持“到账待核实”，可用额度不变。</p>'],
      authorization: ['账户余额执行授权', '<p class="muted small mt8">京东采购预存款 · 福尚云科技有限公司 · 采购账号尾号 4826</p><div class="grid2 mt24"><div class="field"><label class="label" for="modal-auth-limit">单笔限额（元）</label><input id="modal-auth-limit" value="2,000.00"></div><div class="field"><label class="label" for="modal-auth-total">累计限额（元）</label><input id="modal-auth-total" value="20,000.00"></div><div class="field"><label class="label" for="modal-auth-start">生效日期</label><input id="modal-auth-start" value="2026-10-29"></div><div class="field"><label class="label" for="modal-auth-end">到期日期</label><input id="modal-auth-end" value="2026-12-31"></div></div><div class="address-summary mt16">适用范围：本主体、本供应商及本资金账号下，已批准的普通实物采购。</div><p class="small muted mt16">停用授权后，新占用和未发送的下单确认停止；原请求查询、已发生扣款核实和订单跟踪继续。</p>'],
      reconcile: ['账户对账差异', '<p class="muted small mt8">观察区间：2026-10-29 00:00 — 10:50</p><div class="divider"></div><p><strong>200.00 元外部扣款尚未归属</strong></p><p class="muted small mt8">原始资金明细已保存，未找到有效的采购执行关联。暂停新增使用，原订单和资金调查继续。</p><p class="muted small mt16">408.00 元未知订单扣款已计入原占用，不能再次从可用额度扣减。不得根据不同采样时间的余额差直接补造充值或冲账。</p>'],

      logistics: ['子单 100086620101 · 物流', '<p class="muted small mt8">顺丰速运 · SF202610290088</p><div class="address-summary mt24"><strong>商品数量证明：精品挂耳咖啡礼盒 4 盒</strong><p class="small muted mt8">已关联 ERP 发货单 FH20261029-0008。</p></div><ul class="timeline mt24"><li><strong>快件已揽收</strong><time>2026-10-29 11:26</time></li><li><strong>电子运单已创建</strong><time>2026-10-29 11:10</time></li></ul><p class="muted small mt16">其他缺少商品数量的运单可保留轨迹，不增加已发货数量。</p>'],

    };
    function showModal(action) {
      focusBeforeModal = document.activeElement;
      const [title,body] = modalContent[action];
      $('#design-modal-body').innerHTML = `<h2 id="design-modal-title">${title}</h2>${body}`;
      $('#design-modal-confirm').hidden = ['topup-check','ledger','logistics','sales-delivery','reconcile'].includes(action);
      $('#design-modal').hidden = false;
      $('#design-modal-close').focus();
    }
    function closeModal() { $('#design-modal').hidden = true; focusBeforeModal?.focus(); }
    document.addEventListener('click',(event) => {
      const nav = event.target.closest('[data-view]');
      if (nav) { render(nav.dataset.view,states[nav.dataset.view][0][0]); return; }
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (!action) return;
      if (action === 'funds-refund') { render('funds','refund'); window.scrollTo({top:0,behavior:'smooth'}); }
      else if (action.startsWith('go-')) { const target = action.slice(3); render(target,states[target][0][0]); window.scrollTo({top:0,behavior:'smooth'}); }
      else if (modalContent[action]) showModal(action);
      else if (action === 'query-original') toast('设计演示：查询原订单与原确认结果；保持原操作身份，不再次发送。');
      else if (action === 'health') toast('设计演示：仅检查认证与商品读取权限，不创建采购订单。');
      else if (action === 'address-confirm') { render('address','confirmed'); toast('设计演示：地址已确认，已按当前 10 盒重新核验。'); }
      else if (action === 'reset-catalog') { $('#catalog-search').value = ''; $('#catalog-status').selectedIndex = 0; }
      else toast('设计演示：此操作只展示入口，不写入业务数据。');
    });
    $('#design-state').addEventListener('change',(event) => render(currentView,event.target.value));
    $('#design-modal-close').addEventListener('click',closeModal);
    $('#design-modal-confirm').addEventListener('click',() => {closeModal();toast('设计演示：提交前仍须进行权限、审批、额度与证据校验。');});
    $('#design-modal').addEventListener('click',(event) => {if(event.target === $('#design-modal')) closeModal();});
    document.addEventListener('keydown',(event) => {
      if ($('#design-modal').hidden) return;
      if (event.key === 'Escape') closeModal();
      if (event.key === 'Tab') {
        const targets = [...$('#design-modal').querySelectorAll('button,input,select')].filter((el) => !el.hidden && !el.disabled);
        const first = targets[0], last = targets[targets.length - 1];
        if(event.shiftKey && document.activeElement === first){event.preventDefault();last.focus();}
        else if(!event.shiftKey && document.activeElement === last){event.preventDefault();first.focus();}
      }
    });
    const [initialView,initialState] = location.hash.slice(1).split('/');
    const validView = states[initialView] ? initialView : 'connection';
    render(validView,states[validView].some(([state]) => state === initialState) ? initialState : states[validView][0][0]);
  </script>
