[package]
name = "entities"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
entity-core = { path = "../crates/entity-core" }
entity-macros = { path = "../crates/entity-macros" }
argon2 = { workspace = true }
md5 = { workspace = true }
regex = "1.12.3"
rust_decimal = { workspace = true }
validator = { workspace = true }
chrono = { workspace = true }
# 与 workspace 的 mongodb 3.6 解析到同一版本（2.15.x），仅用于 money 的
# Decimal128 序列化委托（bson::Decimal128 的 Serialize/Deserialize 形态）。
bson = "2.15"

[dev-dependencies]
mongodb = { workspace = true }
serde_json = { workspace = true }
# P1 §2.1 敏感字段指纹：带密钥 HMAC（数据模型 §4.5.5，禁止裸摘要）。
hmac = "0.12.1"
sha2 = "0.10.9"
