# Production-only Compose definition. It intentionally contains no `build:`
# keys: the target host runs only digest-pinned release images.
x-logging: &bounded-json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web-api:
    image: ${RS_PROJECT_TEMPLATE_BACKEND_IMAGE:?set RS_PROJECT_TEMPLATE_BACKEND_IMAGE to a pinned image digest}
    restart: unless-stopped
    group_add:
      - "0"
    entrypoint: ["web-api"]
    command: ["--config-path", "/app/config.toml"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_TO_FILE: "false"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${RS_PROJECT_TEMPLATE_CONFIG_FILE:-./config.toml}:/app/config.toml:ro
    ports:
      - "${RS_PROJECT_TEMPLATE_API_HOST_PORT:-10001}:10001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "3",
          "http://127.0.0.1:10001/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *bounded-json-logging
