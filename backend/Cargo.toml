[workspace]
members = [
    "apps/web-api",
    "crates/entity-macros",     # 过程宏项目
    "crates/entity-core",
    "crates/permission-macros",
    "crates/storage",
    "crates/id-generator",
    "crates/test-support",
    "database",
    "entities",
    "services",
    "config",
]
resolver = "2"


[workspace.dependencies]
# Workspace crates
config = { path = "config" }
database = { path = "database" }
entities = { path = "entities" }
entity-core = { path = "crates/entity-core" }
entity-macros = { path = "crates/entity-macros" }
id-generator = { path = "crates/id-generator" }
permission-macros = { path = "crates/permission-macros" }
services = { path = "services" }
storage = { path = "crates/storage" }
test-support = { path = "crates/test-support" }

# 异步运行时
tokio = { version = "1.52.3" }
futures-util = "0.3.32"

# 序列化
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"

# 错误处理
thiserror = "2.0.18"

# 数据库
mongodb = "3.6.0"
bson = "2.15"

# 定点小数（P0-1.3 固化：金额/单价/数量/税率一律使用 entities::money，禁止浮点）
rust_decimal = "1.36"

# 工具库
async-trait = "0.1.89"
chrono = "0.4.44"
regex = "1.12.3"
validator = { version = "0.20.0", features = ["derive"] }

# 日志和追踪
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
uuid = { version = "1.23.1", features = ["v4"] }
url = "2.5.8"

# HTTP相关
axum = { version = "0.8.9", features = ["multipart"] }
tower = "0.5.3"
tower-http = { version = "0.6.10", features = ["cors", "timeout"] }
jwt = "0.16.0"

# 配置中心
nacos-sdk = { version = "0.8.0", default-features = false }

# 加密和编码
argon2 = { version = "0.5.3", features = ["std"] }
md5 = "0.8.0"
aes-gcm = "0.10.3"
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.9"

# 其他工具
clap = { version = "4.6.1", features = ["derive"] }
casbin = "2.20.0"

# 过程宏
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = "2.0.117"

# 对象存储与测试工具
aws-sdk-s3 = "1.141.0"
aws-smithy-http-client = "1.1.12"
tempfile = "3.27.0"

# 日常 debug：压缩调试信息以加快 codegen 和链接。
# 完整调试器用 `cargo build --profile debugging`。
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
