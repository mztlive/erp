[workspace]
members = [
  "apps/cli",
  "apps/web-api",
  "crates/bpm",
  "crates/entity-macros", # 过程宏项目
  "crates/entity-core",
  "crates/permission-macros",
  "crates/storage",
  "crates/id-generator",
  "crates/test-support",
  "database",
  "entities",
  "services",
  "config",
]
resolver = "2"


[workspace.dependencies]
# Workspace crates
bpm = { path = "crates/bpm" }
config = { path = "config" }
database = { path = "database" }
entities = { path = "entities" }
entity-core = { path = "crates/entity-core" }
entity-macros = { path = "crates/entity-macros" }
id-generator = { path = "crates/id-generator" }
permission-macros = { path = "crates/permission-macros" }
services = { path = "services" }
storage = { path = "crates/storage" }
test-support = { path = "crates/test-support" }

# 异步运行时
tokio = { version = "1.53.1" }
futures-util = "0.3.34"

# 序列化
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

# 错误处理
thiserror = "2.0.20"

# 数据库
mongodb = { version = "3.8.1", default-features = false, features = [
  "bson-3",
  "compat-3-3-0",
  "dns-resolver",
  "rustls-tls",
] }
bson = { version = "3.1.0", features = ["serde"] }

# 定点小数（P0-1.3 固化：金额/单价/数量/税率一律使用 entities::money，禁止浮点）
rust_decimal = "1.42.1"

# 工具库
async-trait = "0.1.92"
chrono = "0.4.45"
regex = "1.13.1"
validator = { version = "0.21.0", features = ["derive"] }

# 日志和追踪
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "grpc-tonic",
  "tls-ring",
  "tls-roots",
  "trace",
] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
uuid = { version = "1.25.0", features = ["v4"] }
url = "2.5.8"

# HTTP相关
axum = { version = "0.8.9", features = ["multipart"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "timeout"] }
jwt = "0.16.0"

# 配置中心
nacos-sdk = { version = "0.8.0", default-features = false }

# 加密和编码
argon2 = { version = "0.5.3", features = ["std"] }
md5 = "0.8.1"
aes-gcm = "0.11.1"
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
# jwt 0.16 的签名合同仍基于 RustCrypto hmac 0.12 / sha2 0.10。
jwt-hmac = { package = "hmac", version = "0.12.1" }
jwt-sha2 = { package = "sha2", version = "0.10.9" }

# 其他工具
clap = { version = "4.6.6", features = ["derive"] }
casbin = "2.20.0"

# 过程宏
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.4"

# 对象存储与测试工具
aws-sdk-s3 = "1.143.0"
aws-smithy-http-client = "1.4.0"
tempfile = "3.27.0"

# 日常 debug：压缩调试信息以加快 codegen 和链接。
# 完整调试器用 `cargo build --profile debugging`。
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
