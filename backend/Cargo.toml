[workspace]
members = [
  # 应用
  "apps/cli",
  "apps/web-api",
  # 领域
  "crates/domains/erp-audit",
  "crates/domains/erp-catalog",
  "crates/domains/erp-contract",
  "crates/domains/erp-customer",
  "crates/domains/erp-finance",
  "crates/domains/erp-fulfillment",
  "crates/domains/erp-identity",
  "crates/domains/erp-import",
  "crates/domains/erp-integration",
  "crates/domains/erp-inventory",
  "crates/domains/erp-party",
  "crates/domains/erp-procurement",
  "crates/domains/erp-returns",
  "crates/domains/erp-sales",
  "crates/domains/erp-supplier",
  "crates/domains/erp-supply",
  "crates/domains/erp-support",
  "crates/domains/erp-warehouse",
  "crates/domains/erp-workflow",
  # 业务编排
  "crates/orchestration/erp-approval-runtime",
  "crates/orchestration/erp-data-import",
  "crates/orchestration/erp-demo-data",
  "crates/orchestration/erp-file-assets",
  "crates/orchestration/erp-finance-posting",
  "crates/orchestration/erp-fulfillment-execution",
  "crates/orchestration/erp-master-data",
  "crates/orchestration/erp-order-to-cash",
  "crates/orchestration/erp-procure-to-pay",
  "crates/orchestration/erp-reverse-flow",
  "crates/orchestration/erp-supplier-catalog",
  "crates/orchestration/erp-supplier-orders",
  "crates/orchestration/erp-supply-settlement",
  # 读模型
  "crates/read-models/erp-read-models",
  # 外部适配器
  "crates/adapters/erp-connector-dangaoshushu",
  "crates/adapters/erp-connector-jd-vop",
  "crates/adapters/erp-contract-recognition",
  # 基础合同
  "crates/foundation/application-core",
  "crates/foundation/erp-core",
  "crates/foundation/persistence-core",
  # 技术组件
  "crates/platform/aliyun-ocr",
  "crates/platform/background-runtime",
  "crates/platform/bpm",
  "crates/platform/entity-core",
  "crates/platform/entity-macros",
  "crates/platform/id-generator",
  "crates/platform/storage",
  # 测试支持
  "crates/testing/test-support",
  # 配置
  "config",
]
resolver = "2"

[workspace.metadata.blaze]
# Blaze 0.20261027 无法将此宏依赖的 getrandom 编译为 WebAssembly；仅此宏使用原生展开。
native-proc-macros = ["const-random-macro"]


[workspace.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }
lopdf = { version = "=0.45.0", default-features = false }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
# Workspace crates
# 领域
erp-audit = { path = "crates/domains/erp-audit" }
erp-catalog = { path = "crates/domains/erp-catalog" }
erp-contract = { path = "crates/domains/erp-contract" }
erp-customer = { path = "crates/domains/erp-customer" }
erp-finance = { path = "crates/domains/erp-finance" }
erp-fulfillment = { path = "crates/domains/erp-fulfillment" }
erp-identity = { path = "crates/domains/erp-identity" }
erp-import = { path = "crates/domains/erp-import" }
erp-integration = { path = "crates/domains/erp-integration" }
erp-inventory = { path = "crates/domains/erp-inventory" }
erp-party = { path = "crates/domains/erp-party" }
erp-procurement = { path = "crates/domains/erp-procurement" }
erp-returns = { path = "crates/domains/erp-returns" }
erp-sales = { path = "crates/domains/erp-sales" }
erp-supplier = { path = "crates/domains/erp-supplier" }
erp-supply = { path = "crates/domains/erp-supply" }
erp-support = { path = "crates/domains/erp-support" }
erp-warehouse = { path = "crates/domains/erp-warehouse" }
erp-workflow = { path = "crates/domains/erp-workflow" }
# 业务编排
erp-approval-runtime = { path = "crates/orchestration/erp-approval-runtime" }
erp-data-import = { path = "crates/orchestration/erp-data-import" }
erp-demo-data = { path = "crates/orchestration/erp-demo-data" }
erp-file-assets = { path = "crates/orchestration/erp-file-assets" }
erp-finance-posting = { path = "crates/orchestration/erp-finance-posting" }
erp-fulfillment-execution = { path = "crates/orchestration/erp-fulfillment-execution" }
erp-master-data = { path = "crates/orchestration/erp-master-data" }
erp-order-to-cash = { path = "crates/orchestration/erp-order-to-cash" }
erp-procure-to-pay = { path = "crates/orchestration/erp-procure-to-pay" }
erp-reverse-flow = { path = "crates/orchestration/erp-reverse-flow" }
erp-supplier-catalog = { path = "crates/orchestration/erp-supplier-catalog" }
erp-supplier-orders = { path = "crates/orchestration/erp-supplier-orders" }
erp-supply-settlement = { path = "crates/orchestration/erp-supply-settlement" }
# 读模型
erp-read-models = { path = "crates/read-models/erp-read-models" }
# 外部适配器
erp-connector-dangaoshushu = { path = "crates/adapters/erp-connector-dangaoshushu" }
erp-connector-jd-vop = { path = "crates/adapters/erp-connector-jd-vop" }
erp-contract-recognition = { path = "crates/adapters/erp-contract-recognition" }
# 基础合同
application-core = { path = "crates/foundation/application-core" }
erp-core = { path = "crates/foundation/erp-core" }
persistence-core = { path = "crates/foundation/persistence-core" }
# 技术组件
aliyun-ocr = { path = "crates/platform/aliyun-ocr" }
background-runtime = { path = "crates/platform/background-runtime" }
bpm = { path = "crates/platform/bpm" }
entity-core = { path = "crates/platform/entity-core" }
entity-macros = { path = "crates/platform/entity-macros" }
id-generator = { path = "crates/platform/id-generator" }
storage = { path = "crates/platform/storage" }
# 测试支持
test-support = { path = "crates/testing/test-support" }
# 配置
config = { path = "config" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rig-core = { version = "=0.43.0", default-features = false }
rig-agent = { version = "=0.43.0", default-features = false }
bytes = "1"

# 异步运行时
tokio = { version = "1.53.1" }
futures-util = "0.3.34"

# 序列化
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

# 错误处理
thiserror = "2.0.20"

# 数据库
mongodb = { version = "3.8.1", default-features = false, features = [
  "bson-3",
  "compat-3-3-0",
  "dns-resolver",
  "rustls-tls",
] }
bson = { version = "3.1.0", features = ["serde"] }

# 定点小数（P0-1.3 固化：金额/单价/数量/税率一律使用 erp_core::money，禁止浮点）
rust_decimal = "1.42.1"

# 工具库
async-trait = "0.1.92"
chrono = "0.4.45"
regex = "1.13.1"
validator = { version = "0.21.0", features = ["derive"] }

# 日志和追踪
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "grpc-tonic",
  "tls-ring",
  "tls-roots",
  "trace",
] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
uuid = { version = "1.25.0", features = ["v4"] }
url = "2.5.8"

# HTTP相关
axum = { version = "0.8.9", features = ["multipart"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "timeout"] }
jwt = "0.16.0"

# 配置中心
nacos-sdk = { version = "0.8.0", default-features = false }

# 加密和编码
argon2 = { version = "0.5.3", features = ["std"] }
md5 = "0.8.1"
sha1 = "0.11.0"
subtle = "2.6.1"
aes-gcm = "0.11.1"
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
# jwt 0.16 的签名合同仍基于 RustCrypto hmac 0.12 / sha2 0.10。
jwt-hmac = { package = "hmac", version = "0.12.1" }
jwt-sha2 = { package = "sha2", version = "0.10.9" }

# 其他工具
clap = { version = "4.6.6", features = ["derive"] }
casbin = "2.20.0"

# 过程宏
quote = "1.0.47"
syn = "3.0.4"

# 对象存储与测试工具
aws-sdk-s3 = "1.143.0"
aws-smithy-http-client = "1.4.0"
tempfile = "3.27.0"

rust_xlsxwriter = "=0.100.0"

# Excel 导入（xlsx 为 zip 包）
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

# 日常 debug：压缩调试信息以加快 codegen 和链接。
# 完整调试器用 `cargo build --profile debugging`。
[profile.dev]
debug = "line-tables-only"
incremental = true

# 第三方依赖在 dev 也开优化：argon2、bson/serde、mongodb 驱动、casbin 在 opt-level 0 下
# 会把登录与每个请求拖慢数倍（本地联调与 E2E 都跑 dev 二进制）。依赖只在版本变化时重编，
# 工作区 crate 仍不优化，增量编译速度不受影响。
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.debugging]
inherits = "dev"
debug = true
