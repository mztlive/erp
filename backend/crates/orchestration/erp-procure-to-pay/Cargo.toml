[package]
name = "erp-procure-to-pay"
version = "0.1.0"
edition = "2024"
autotests = false

[dependencies]
erp-permissions.workspace = true
application-core = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bpm = { workspace = true }
config = { workspace = true }
entity-core = { workspace = true }
erp-approval-runtime = { workspace = true }
erp-audit = { workspace = true }
erp-catalog = { workspace = true }
erp-core = { workspace = true }
erp-file-assets = { workspace = true }
erp-finance = { workspace = true }
erp-fulfillment = { workspace = true }
erp-fulfillment-execution = { workspace = true }
erp-identity = { workspace = true }
erp-inventory = { workspace = true }
erp-procurement = { workspace = true }
erp-read-models = { workspace = true }
erp-returns = { workspace = true }
erp-sales = { workspace = true }
erp-supplier = { workspace = true }
erp-supplier-catalog = { workspace = true }
erp-supplier-orders = { workspace = true }
erp-supply = { workspace = true }
erp-support = { workspace = true }
erp-warehouse = { workspace = true }
erp-workflow = { workspace = true }
hex = { workspace = true }
id-generator = { workspace = true }
mongodb = { workspace = true }
persistence-core = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart"] }
