[source.crates-io]
replace-with = 'rsproxy-sparse'
[source.rsproxy]
registry = "https://rsproxy.cn/crates.io-index"
[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"
[registries.rsproxy]
index = "https://rsproxy.cn/crates.io-index"
[net]
git-fetch-with-cli = true

# Cranelift 仅用于本地 nightly dev（见仓库根目录与 backend/ 的 rust-toolchain.toml）。
# Cargo 1.97 stable 无法解析 profile.dev.codegen-backend，IDE rust-analyzer 必须走 nightly。
# release / Docker（rust:1.97）不复制本文件，仍走 LLVM。
[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"

# 依赖（尤其 rustls / aws-lc-rs）走 LLVM：Cranelift 不支持 #[link_name] 的 \u{1} 前缀，
# 会把 native 符号编错。工作区 crate 仍用上面的 Cranelift。
[profile.dev.package."*"]
codegen-backend = "llvm"
