# Local/container integration stack. Production deployment uses
# docker-compose.production.yml and digest-pinned images.
#
# 本地 MongoDB 单节点副本集（集成测试）两种启动方式：
#   1) docker compose --profile test up -d mongo
#   2) backend/scripts/dev-mongo.sh（等价能力，无需 docker compose）
# 启动后 export ERP_TEST_MONGO_URI='mongodb://127.0.0.1:27017/?replicaSet=rs0'
# 再执行 cargo test --workspace -- --include-ignored（事务需要副本集）。
x-logging: &bounded-json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web-api:
    image: rs-project-template-backend:${RS_PROJECT_TEMPLATE_LOCAL_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    user: "${RS_PROJECT_TEMPLATE_LOCAL_UID:-10001}:${RS_PROJECT_TEMPLATE_LOCAL_GID:-0}"
    group_add:
      - "0"
    entrypoint: ["web-api"]
    command: ["--config-path", "/app/config.toml"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_TO_FILE: "false"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${RS_PROJECT_TEMPLATE_CONFIG_FILE:-./config.toml}:/app/config.toml:ro
      - ./uploads:/app/uploads
    ports:
      - "${RS_PROJECT_TEMPLATE_API_HOST_PORT:-10001}:10001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "3",
          "http://127.0.0.1:10001/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *bounded-json-logging

  # 集成测试专用 MongoDB 单节点副本集（事务需要副本集）。
  # 启动：docker compose --profile test up -d mongo
  mongo:
    image: mongo:7
    profiles: ["test"]
    command: ["--replSet", "rs0"]
    restart: unless-stopped
    ports:
      - "${ERP_MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - erp-mongo-test-data:/data/db

volumes:
  erp-mongo-test-data:
