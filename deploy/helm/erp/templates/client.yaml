apiVersion: v1
kind: ServiceAccount
metadata:
  name: erp-client
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: erp-client
    app.kubernetes.io/part-of: erp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-client
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: erp-client
    app.kubernetes.io/part-of: erp
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: erp-client
  template:
    metadata:
      annotations:
        erp/release: {{ .Values.releaseId | quote }}
      labels:
        app.kubernetes.io/name: erp-client
        app.kubernetes.io/part-of: erp
        app.kubernetes.io/component: web
    spec:
{{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . | quote }}
{{- end }}
      serviceAccountName: erp-client
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: erp-client
          image: {{ .Values.client.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # Kubernetes 会把 HOSTNAME 设成 Pod 名。standalone 服务器会据此绑定，
            # 探针访问 Pod IP 会失败，所以这里固定为 0.0.0.0。
            - name: HOSTNAME
              value: 0.0.0.0
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.client.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: erp-client
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: erp-client
    app.kubernetes.io/part-of: erp
    app.kubernetes.io/component: web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: erp-client
  ports:
    - name: http
      port: 3000
      targetPort: http
