apiVersion: v1
kind: ServiceAccount
metadata:
  name: erp-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: erp-api
    app.kubernetes.io/part-of: erp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: erp-api
    app.kubernetes.io/part-of: erp
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: erp-api
  template:
    metadata:
      annotations:
        erp/release: {{ .Values.releaseId | quote }}
        erp/config-revision: {{ .Values.api.configRevision | quote }}
      labels:
        app.kubernetes.io/name: erp-api
        app.kubernetes.io/part-of: erp
        app.kubernetes.io/component: api
    spec:
{{- with .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . | quote }}
{{- end }}
      serviceAccountName: erp-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: erp-api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --enable-nacos
            - --nacos-addr
            - {{ .Values.api.nacos.serverAddr | quote }}
            - --nacos-namespace
            - {{ .Values.api.nacos.namespace | quote }}
            - --nacos-group
            - {{ .Values.api.nacos.group | quote }}
            - --nacos-data-id
            - {{ .Values.api.nacos.dataId | quote }}
          ports:
            - name: http
              containerPort: 10001
          env:
            - name: NACOS_CLIENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.configSecret | quote }}
                  key: NACOS_USERNAME
            - name: NACOS_CLIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.configSecret | quote }}
                  key: NACOS_PASSWORD
            - name: RUST_LOG
              value: info
            - name: LOG_FORMAT
              value: json
            - name: LOG_TO_FILE
              value: "false"
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: erp-api
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ""
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "deployment.environment.name=%s" .Values.environment | quote }}
            - name: TZ
              value: Asia/Shanghai
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # /health 只表示进程已开始监听。索引和副本集校验发生在监听之前，
          # 所以用较长的 startupProbe。/ready 在外部连接器未配置时返回 503，不能当探针。
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: erp-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: erp-api
    app.kubernetes.io/part-of: erp
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: erp-api
  ports:
    - name: http
      port: 10001
      targetPort: http
