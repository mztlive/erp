# 开发集群用的单节点副本集。没有认证，也不要把它当生产库。
# 官方镜像入口需要先以 root 修正数据目录权限，因此这里不设置 runAsNonRoot。
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    app.kubernetes.io/part-of: erp
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: erp
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: erp
    app.kubernetes.io/component: database
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        app.kubernetes.io/part-of: erp
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongo
          image: mongo:7
          imagePullPolicy: IfNotPresent
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-replicaset-init
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: erp
    app.kubernetes.io/component: database
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo-replicaset-init
        app.kubernetes.io/part-of: erp
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: init
          image: mongo:7
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command: ["bash", "-lc"]
          args:
            - |
              set -eu
              host="mongo-0.mongo.${POD_NAMESPACE}.svc.cluster.local"
              ready=0
              for _ in {1..60}; do
                if mongosh --quiet --host "$host" --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1; then
                  ready=1
                  break
                fi
                sleep 2
              done
              if [ "$ready" -ne 1 ]; then
                echo "mongo did not become reachable at ${host}" >&2
                exit 1
              fi
              mongosh --quiet --host "$host" --eval "
                const host = '${host}:27017';
                try {
                  const status = rs.status();
                  if (status.ok === 1) {
                    quit(0);
                  }
                } catch (error) {}
                const result = rs.initiate({
                  _id: 'rs0',
                  members: [{ _id: 0, host: host }]
                });
                if (!result.ok) {
                  printjson(result);
                  quit(1);
                }
              "
