apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  - pdb.yaml
patches:
  - target:
      kind: Ingress
      name: erp
    patch: |-
      - op: add
        path: /metadata/annotations/ingress.cloud.tencent.com~1enable-group
        value: "true"
      - op: add
        path: /metadata/annotations/kubernetes.io~1ingress.existLbId
        value: lb-gpk8k2ps
  # 共享监听器的默认域名由入口管理方统一维护，ERP 不声明该全局设置。
  - target:
      kind: TkeServiceConfig
      name: erp
    patch: |-
      - op: remove
        path: /spec/loadBalancer/l7Listeners/0/defaultServer
replicas:
  - name: web-api
    count: 1
  - name: erp-client
    count: 1
images:
  # 发布前改成仓库地址和不可变 digest，不要保留 replace-with-release。
  # kubectl kustomize 之后确认镜像形如 registry.example.com/erp/web-api@sha256:...
  - name: erp-web-api
    newName: registry.example.com/erp/web-api
    newTag: replace-with-release
  - name: erp-client
    newName: registry.example.com/erp/erp-client
    newTag: replace-with-release
