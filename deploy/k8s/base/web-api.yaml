apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-api
  labels:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/part-of: erp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
  labels:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/part-of: erp
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-api
        app.kubernetes.io/part-of: erp
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: web-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-api
          image: erp-web-api:dev
          imagePullPolicy: IfNotPresent
          args: ["--config-path", "/app/config.toml"]
          ports:
            - name: http
              containerPort: 10001
          env:
            - name: RUST_LOG
              value: info
            - name: LOG_FORMAT
              value: json
            - name: LOG_TO_FILE
              value: "false"
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: erp-web-api
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ""
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=production
            - name: TZ
              value: Asia/Shanghai
            - name: HOME
              value: /tmp
          volumeMounts:
            # 进程只在启动时读取该文件。更新 Secret 后要 rollout restart。
            - name: config
              mountPath: /app/config.toml
              subPath: config.toml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # /health 只表示进程已开始监听。索引和副本集校验发生在监听之前，
          # 所以用较长的 startupProbe。/ready 在外部连接器未配置时返回 503，不能当探针。
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          secret:
            secretName: web-api-config
            items:
              - key: config.toml
                path: config.toml
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-api
  labels:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/part-of: erp
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: web-api
  ports:
    - name: http
      port: 10001
      targetPort: http
